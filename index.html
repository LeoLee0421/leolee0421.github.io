<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Yu-Chieh Lee 李祐頡</title>
<meta name="description" content="李祐頡 Leo Yu-Chieh Lee — 國立臺灣大學經濟學系。學術研究、攝影作品與賽事籌辦。">
<meta property="og:title" content="Leo Yu-Chieh Lee 李祐頡">
<meta property="og:description" content="Research · Photography · Event organizing">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+TC:wght@400;600&family=Inter:wght@400;500;600&family=Fraunces:ital,opsz,wght@1,9..144,600&display=swap" rel="stylesheet">
<style>
  /* ===== 顏色與字型：要換風格，改這裡就好 ===== */
  :root{
    --bg:#FBFAF7;
    --text:#1F2328;
    --muted:#5F6670;
    --faint:#8A9099;
    --line:#E4E1DA;
    --accent:#1E3A5F;      /* 學術：深藍 */
    --accent-soft:#E8EEF5;
    --event:#B4441F;       /* 賽事：磚紅 */
    --event-deep:#2A1A14;
    --gallery:#0F1012;     /* 攝影：畫廊黑 */
    --gallery-text:#ECEAE5;
    --gallery-muted:#9A9DA3;
    --gallery-line:#26282C;
    --serif:'Source Serif 4','Noto Serif TC',Georgia,serif;
    --sans:'Inter','Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181C; --text:#E6E4DF; --muted:#A3A7AE; --faint:#7C818A;
      --line:#2C3036; --accent:#9DB8DA; --accent-soft:#1F2833; --event:#E07A52;
    }
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--serif); font-size:17px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s; }
  a:hover{ border-bottom-color:currentColor; }
  img{ display:block; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }

  .view{ display:none; }
  .view.active{ display:block; animation:fade .35s ease; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  h1{ font-size:34px; font-weight:600; line-height:1.2; margin:0 0 8px; letter-spacing:-.01em; }
  h2{ font-family:var(--sans); font-size:18px; font-weight:600; color:var(--accent); margin:48px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  h3{ font-family:var(--sans); font-size:14px; font-weight:600; color:var(--muted); margin:24px 0 6px; }
  .lead{ color:var(--muted); margin:0 0 8px; max-width:68ch; }

  /* 按鈕與標籤 */
  .links{ display:flex; flex-wrap:wrap; gap:10px; font-family:var(--sans); font-size:14px; }
  .links a{ border:1px solid var(--line); padding:6px 14px; border-radius:20px; color:var(--text); }
  .links a:hover{ border-color:var(--accent); color:var(--accent); }
  .links a.primary{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .tag{
    display:inline-block; font-family:var(--sans); font-size:11px; font-weight:500; letter-spacing:.03em;
    padding:1px 8px; border-radius:10px; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:2px;
  }
  .lecture{
    display:inline-block; font-size:12px; line-height:1.5; padding:0 9px; border:1px solid var(--line); border-radius:10px;
    color:var(--muted); margin-right:8px;
  }
  .lang{
    font-family:var(--sans); font-size:12.5px; color:inherit; background:none; cursor:pointer;
    border:1px solid currentColor; border-radius:12px; padding:2px 10px; opacity:.75;
  }
  .lang:hover{ opacity:1; }

  /* 列表 */
  .list{ list-style:none; padding:0; margin:0; }
  .list li{ padding:10px 0; border-bottom:1px solid var(--line); }
  .list li:last-child{ border-bottom:0; }
  .title{ font-weight:600; }
  .meta{ display:block; font-family:var(--sans); font-size:13.5px; color:var(--muted); margin-top:2px; }
  .cv li{ display:grid; grid-template-columns:110px 1fr; gap:16px; }
  .cv .when{ font-family:var(--sans); font-size:13.5px; color:var(--faint); padding-top:3px; }

  /* 子頁上方列 */
  .topbar{
    position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .topbar-inner{ display:flex; align-items:center; gap:20px; padding-top:12px; padding-bottom:12px; }
  .back{ font-family:var(--sans); font-size:14px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .back:hover{ color:var(--text); }
  .tabs{ display:flex; gap:20px; margin-left:auto; overflow-x:auto; font-family:var(--sans); font-size:14px; }
  .tabs a{ color:var(--muted); white-space:nowrap; cursor:pointer; }
  .tabs a:hover{ color:var(--text); }
  .topbar .lang{ color:var(--muted); }
  .topbar .spacer{ margin-left:auto; }

  footer{ padding:28px 0 40px; font-family:var(--sans); font-size:13px; color:var(--faint); }

  /* ===== 首頁：全黑底 ===== */
  #view-home{ background:#000; color:#fff; min-height:100vh; }
  #view-home footer{ color:rgba(255,255,255,.4); }
  .banner{ position:relative; color:#fff; overflow:hidden; background:#000; }
  .banner.has-img{ background-size:cover; background-position:center; }
  .banner.has-img::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,14,20,.78) 0%, rgba(10,14,20,.45) 60%, rgba(10,14,20,.25) 100%); }
  /* 內容區比整頁窄並置中，讓 banner 往中間靠但仍靠左排列 */
  .banner-inner{ position:relative; display:grid; grid-template-columns:240px 1fr; gap:44px; align-items:center; max-width:900px; padding-top:72px; padding-bottom:28px; }
  .banner .avatar{ width:240px; height:240px; object-fit:cover; border:3px solid rgba(255,255,255,.85); background:rgba(255,255,255,.15); }
  .banner h1{ font-size:40px; margin:0; color:#fff; }
  .banner .alt{ font-size:20px; opacity:.8; margin:0 0 14px; }
  .banner .roles{ list-style:none; padding:0; margin:0 0 14px; font-size:16.5px; }
  .banner .roles li{ padding:2px 0; opacity:.92; }
  .banner .bio{ max-width:60ch; margin:0 0 18px; opacity:.92; }
  .banner .links a{ color:#fff; border-color:rgba(255,255,255,.5); }
  .banner .links a:hover{ border-color:#fff; color:#fff; }
  .banner .links a.primary{ background:#fff; border-color:#fff; color:#000; }
  .banner .lang{ position:absolute; top:18px; right:24px; z-index:1; color:#fff; }

  .portals{ padding-top:28px; padding-bottom:40px; }
  /* 圓圈上方的標題：Fraunces 斜體，每個字首字母大寫 */
  .portals-title{ font-family:'Fraunces','Noto Serif TC',Georgia,serif; font-style:italic; font-weight:600; font-size:34px; line-height:1.2; text-transform:capitalize; color:#fff; text-align:center; margin:0 0 26px; }
  .portal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
  .portal{ display:flex; flex-direction:column; align-items:center; text-align:center; color:#fff; border:0; cursor:pointer; }
  .portal:hover{ border:0; }
  .ring{
    width:min(220px, 100%); aspect-ratio:1; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .ring img{ width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  .ring svg{ width:64px; height:64px; stroke:#fff; fill:none; stroke-width:1.4; opacity:.9; }
  .portal:hover .ring{ transform:translateY(-6px); box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 18px 40px rgba(255,255,255,.08); }
  .portal:hover .ring img{ transform:scale(1.06); }
  .portal-name{ font-family:var(--sans); font-size:19px; font-weight:600; margin-top:20px; }
  .portal-sub{ font-family:var(--sans); font-size:14px; color:rgba(255,255,255,.6); margin-top:2px; }

  /* 點圓圈的轉場：一個圓從圓圈位置放大到蓋滿畫面 */
  .portal-fx{ position:fixed; inset:0; z-index:100; pointer-events:none; display:none; }
  .portal-fx.on{ display:block; }

  /* ===== 學術 ===== */
  .academic{ display:grid; grid-template-columns:250px 1fr; gap:56px; padding-top:44px; }
  .side{ position:sticky; top:84px; align-self:start; }
  .side img{ width:180px; height:210px; object-fit:cover; border-radius:4px; background:var(--line); margin-bottom:18px; }
  .side .name{ font-size:22px; font-weight:600; line-height:1.3; }
  .side .alt{ color:var(--muted); margin-bottom:12px; }
  .side ul{ list-style:none; padding:0; margin:0 0 16px; font-family:var(--sans); font-size:14px; color:var(--muted); line-height:1.55; }
  .side ul li{ margin-bottom:6px; }
  .side .links{ flex-direction:column; align-items:flex-start; gap:6px; }
  .side .links a{ border:0; padding:0; color:var(--accent); }
  .side .links a:hover{ border-bottom:1px solid currentColor; }
  .academic main h2:first-child{ margin-top:0; }
  .bio-text p{ margin:0 0 12px; max-width:70ch; }

  /* ===== 攝影：畫廊 ===== */
  #view-photography{ background:var(--gallery); color:var(--gallery-text); min-height:100vh; }
  #view-photography .topbar{ background:color-mix(in srgb, var(--gallery) 88%, transparent); border-bottom-color:var(--gallery-line); }
  #view-photography .back, #view-photography .topbar .lang{ color:var(--gallery-muted); }
  #view-photography .back:hover{ color:var(--gallery-text); }
  #view-photography a{ color:var(--gallery-text); }
  #view-photography footer{ color:var(--gallery-muted); }
  .gallery-head{ padding-top:64px; padding-bottom:12px; }
  .gallery-head h1{ font-size:44px; font-weight:400; letter-spacing:.01em; }
  .gallery-head .lead{ color:var(--gallery-muted); }
  .gallery-head .links a{ color:var(--gallery-text); border-color:var(--gallery-line); }
  .gallery-head .links a:hover{ border-color:var(--gallery-text); }
  .albums{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:36px 28px; padding-top:36px; padding-bottom:24px; }
  .album-card{ display:block; border:0; cursor:pointer; }
  .album-card:hover{ border:0; }
  .album-card .cover{ aspect-ratio:4/3; overflow:hidden; background:var(--gallery-line); border-radius:2px; display:flex; align-items:center; justify-content:center; }
  .album-card .cover img{ width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .3s; opacity:.92; }
  .album-card:hover .cover img{ transform:scale(1.04); opacity:1; }
  .album-card .cover svg{ width:44px; height:44px; stroke:var(--gallery-muted); fill:none; stroke-width:1.3; }
  .album-card .cap{ margin-top:12px; }
  .album-card .cap b{ display:block; font-weight:400; font-size:19px; line-height:1.35; }
  .album-card .cap span{ display:block; font-family:var(--sans); font-size:13px; color:var(--gallery-muted); margin-top:4px; }
  .album-head{ padding-top:48px; padding-bottom:8px; }
  .album-head .back{ display:inline-block; margin-bottom:22px; }
  .album-head h1{ font-size:38px; font-weight:400; }
  .album-head .meta{ color:var(--gallery-muted); }
  .album-head p{ max-width:68ch; color:var(--gallery-muted); }
  .album-head .drive{ font-family:var(--sans); font-size:14px; }
  .masonry{ columns:3 300px; column-gap:14px; padding-top:28px; padding-bottom:24px; }
  .masonry img{ width:100%; height:auto; margin:0 0 14px; break-inside:avoid; border-radius:2px; cursor:zoom-in; background:var(--gallery-line); }

  .lightbox{ position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:rgba(5,6,8,.94); }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:calc(100% - 120px); max-height:calc(100% - 80px); object-fit:contain; }
  .lightbox button{
    position:absolute; background:none; border:0; color:#fff; opacity:.7; cursor:pointer; font-family:var(--sans);
    font-size:34px; line-height:1; padding:16px;
  }
  .lightbox button:hover{ opacity:1; }
  .lightbox .prev{ left:8px; top:50%; transform:translateY(-50%); }
  .lightbox .next{ right:8px; top:50%; transform:translateY(-50%); }
  .lightbox .close{ top:8px; right:8px; font-size:28px; }
  .lightbox .count{ position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#aaa; font-family:var(--sans); font-size:13px; }

  /* ===== 賽事 ===== */
  .event-hero{ background:var(--event-deep); color:#fff; }
  .event-hero-inner{ display:grid; grid-template-columns:1fr 360px; gap:48px; align-items:center; padding-top:64px; padding-bottom:64px; }
  .event-hero.no-poster .event-hero-inner{ grid-template-columns:1fr; }
  .kicker{ font-family:var(--sans); font-size:12.5px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:#F3A27F; }
  .event-hero h1{ font-size:44px; color:#fff; margin:10px 0 8px; }
  .event-hero .tagline{ font-size:19px; opacity:.85; margin:0 0 20px; max-width:56ch; }
  .facts{ display:flex; flex-wrap:wrap; gap:10px 28px; font-family:var(--sans); font-size:15px; margin-bottom:22px; }
  .facts span{ opacity:.9; }
  .facts b{ font-weight:600; color:#F3A27F; margin-right:6px; }
  .countdown{ display:inline-block; font-family:var(--sans); font-size:14px; font-weight:600; background:var(--event); color:#fff; padding:6px 14px; border-radius:20px; margin-bottom:22px; }
  .event-hero .links a{ color:#fff; border-color:rgba(255,255,255,.45); }
  .event-hero .links a:hover{ border-color:#fff; color:#fff; }
  .event-hero .links a.primary{ background:var(--event); border-color:var(--event); }
  .poster img{ width:100%; border-radius:4px; box-shadow:0 20px 50px rgba(0,0,0,.4); cursor:zoom-in; }
  .events h2{ color:var(--event); }
  .event-desc p{ margin:0 0 12px; max-width:70ch; }
  .teams{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:20px; }
  .division{ border:1px solid var(--line); border-radius:6px; padding:16px 20px 10px; }
  .division-head{ display:flex; justify-content:space-between; align-items:baseline; padding-bottom:10px; border-bottom:2px solid var(--event); font-family:var(--sans); }
  .division-head b{ font-size:16px; }
  .division-head span{ font-size:13px; color:var(--muted); }
  .division ol{ margin:0; padding:6px 0 0 1.6em; }
  .division li{ padding:6px 0; border-bottom:1px solid var(--line); }
  .division li:last-child{ border-bottom:0; }
  .division li::marker{ font-family:var(--sans); font-size:13px; color:var(--faint); }
  .division small{ display:block; font-family:var(--sans); font-size:13px; color:var(--muted); }
  .map{ margin-top:16px; aspect-ratio:16/7; border-radius:6px; overflow:hidden; border:1px solid var(--line); background:var(--line); }
  .map iframe{ width:100%; height:100%; border:0; display:block; }
  .map-link{ font-family:var(--sans); font-size:14px; margin:8px 0 0; }
  .schedule li{ display:grid; grid-template-columns:110px 1fr; gap:16px; }
  .schedule .when{ font-family:var(--sans); font-size:14px; color:var(--event); font-weight:600; padding-top:2px; }
  .log li{ display:grid; grid-template-columns:96px 1fr; gap:14px; }
  .log .when{ font-family:var(--sans); font-size:13.5px; color:var(--faint); padding-top:2px; }
  .empty{ color:var(--muted); font-style:italic; }

  /* ===== 手機 ===== */
  @media (max-width:760px){
    body{ font-size:16px; }
    h1{ font-size:28px; }
    .banner-inner{ grid-template-columns:1fr; gap:20px; padding-top:64px; padding-bottom:20px; }
    .banner .avatar{ width:170px; height:170px; }
    .banner h1{ font-size:31px; }
    .portals{ padding-top:24px; }
    .portals-title{ font-size:28px; }
    .portal-grid{ grid-template-columns:1fr; gap:36px; }
    .ring{ width:180px; }
    .academic{ grid-template-columns:1fr; gap:8px; padding-top:28px; }
    .side{ position:static; display:grid; grid-template-columns:96px 1fr; gap:0 18px; }
    .side img{ width:96px; height:116px; grid-row:span 4; }
    .side .links{ flex-direction:row; gap:6px 14px; }
    .tabs{ gap:14px; }
    .cv li, .log li{ grid-template-columns:1fr; gap:0; }
    .schedule li{ grid-template-columns:64px 1fr; gap:12px; }
    .map{ aspect-ratio:4/3; }
    .gallery-head h1{ font-size:34px; }
    .albums{ grid-template-columns:1fr 1fr; gap:22px 14px; }
    .album-card .cap b{ font-size:16px; }
    .masonry{ columns:2; column-gap:8px; }
    .masonry img{ margin-bottom:8px; }
    .lightbox img{ max-width:100%; }
    .event-hero-inner{ grid-template-columns:1fr; gap:28px; padding-top:44px; padding-bottom:44px; }
    .event-hero h1{ font-size:32px; }
    .poster{ max-width:320px; }
  }
  @media (max-width:440px){
    .albums{ grid-template-columns:1fr; }
  }
  @media (prefers-reduced-motion: reduce){
    .view.active{ animation:none; }
    .ring, .ring img, .album-card .cover img{ transition:none; }
  }
</style>
</head>
<body>

<div class="view" id="view-home"></div>
<div class="view" id="view-academic"></div>
<div class="view" id="view-photography"></div>
<div class="view" id="view-events"></div>

<div class="portal-fx" id="portal-fx"></div>
<div class="lightbox" id="lightbox">
  <img alt="">
  <button type="button" class="prev" aria-label="Previous">‹</button>
  <button type="button" class="next" aria-label="Next">›</button>
  <button type="button" class="close" aria-label="Close">×</button>
  <div class="count"></div>
</div>

    var ig = s.instagram ? '<div class="links" style="margin-top:18px;"><a href="' + esc(s.instagram) + '" target="_blank" rel="noopener">Instagram'
      + (s.instagram_handle ? " · " + esc(s.instagram_handle) : "") + ' ↗</a></div>' : "";
    return topbar() + '<div class="wrap gallery-head"><h1>' + esc(tr("photography")) + '</h1><p class="lead">' + esc(loc(s, "photo_intro") || tr("photoLead")) + '</p>' + ig + '</div>'
      + '<div class="wrap albums">' + list.map(function (a, i) {
          var photos = albumPhotos(a), cover = a.cover || photos[0];
          var inner = '<div class="cover">' + (cover ? '<img loading="lazy" src="' + esc(imgUrl(cover, 900)) + '" alt="">' : ICONS.photography) + '</div>'
            + '<div class="cap"><b>' + esc(loc(a, "title")) + '</b><span>' + albumMeta(a)
            + (photos.length ? (albumMeta(a) ? " · " : "") + photos.length + " " + esc(tr("photos")) : "") + '</span></div>';
          // 沒有精選照片的活動，直接連到 Google Drive
          return photos.length ? '<a class="album-card" href="#photography/' + i + '" data-album="' + i + '">' + inner + '</a>'
            : '<a class="album-card" href="' + esc(a.drive_url || "#") + '" target="_blank" rel="noopener">' + inner + '</a>';
        }).join("") + '</div>' + footer(s);
  }
  function albumHTML(s, a) {
    var desc = loc(a, "description");
    return topbar() + '<div class="wrap album-head"><a class="back" data-album="all">' + esc(tr("allAlbums")) + '</a>'
      + '<h1>' + esc(loc(a, "title")) + '</h1><span class="meta">' + albumMeta(a) + '</span>'
      + (desc ? '<p>' + esc(desc) + '</p>' : "")
      + (a.drive_url ? '<p class="drive"><a href="' + esc(a.drive_url) + '" target="_blank" rel="noopener">' + esc(tr("drive")) + '</a></p>' : "")
      + '</div><div class="wrap masonry">' + albumPhotos(a).map(function (u, i) {
          return '<img loading="lazy" src="' + esc(imgUrl(u, 900)) + '" data-full="' + esc(imgUrl(u, 2000)) + '" data-i="' + i + '" alt="' + esc(loc(a, "title")) + '">';
        }).join("") + '</div>' + footer(s);
  }

  /* ---------- 賽事 ---------- */
  function daysUntil(d) {
    var m = String(d || "").match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (!m) return null;
    var start = new Date(+m[1], m[2] - 1, +m[3]), now = new Date();
    now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((start - now) / 86400000);
  }
  function eventsHTML(s) {
    var e = eventInfo(), sched = rows("EventSchedule");
    var name = loc(e, "name"), poster = e.poster_url;
    var dateText = loc(e, "date_text") || [e.start_date, e.end_date].filter(Boolean).join(" – ");
    var days = daysUntil(e.start_date);
    var btns = [];
    if (e.register_url) btns.push('<a class="primary" href="' + esc(e.register_url) + '" target="_blank" rel="noopener">' + esc(tr("register")) + ' ↗</a>');
    if (e.rules_url) btns.push('<a href="' + esc(e.rules_url) + '" target="_blank" rel="noopener">' + esc(tr("rules")) + ' ↗</a>');
    if (e.website) btns.push('<a href="' + esc(e.website) + '" target="_blank" rel="noopener">' + esc(tr("website")) + ' ↗</a>');
    if (e.instagram) btns.push('<a href="' + esc(e.instagram) + '" target="_blank" rel="noopener">Instagram ↗</a>');
    if (e.contact_email) btns.push('<a href="mailto:' + esc(e.contact_email) + '">' + esc(tr("contact")) + '</a>');
    var facts = [[tr("date"), dateText], [tr("venue"), loc(e, "venue")], [tr("role"), loc(e, "my_role")]]
      .filter(function (f) { return f[1]; }).map(function (f) { return '<span><b>' + esc(f[0]) + '</b>' + esc(f[1]) + '</span>'; }).join("");

    var hero = '<section class="event-hero' + (poster ? "" : " no-poster") + '"><div class="wrap event-hero-inner"><div>'
      + '<div class="kicker">' + esc(tr("organizing")) + '</div>'
      + '<h1>' + esc(name || tr("events")) + '</h1>'
      + (loc(e, "tagline") ? '<p class="tagline">' + esc(loc(e, "tagline")) + '</p>' : (name ? "" : '<p class="tagline">' + esc(tr("eventSoon")) + '</p>'))
      + (facts ? '<div class="facts">' + facts + '</div>' : "")
      + (days != null && days >= 0 ? '<div class="countdown">' + esc(days === 0 ? tr("today") : tr("daysToGo")(days)) + '</div>' : "")
      + (btns.length ? '<div class="links">' + btns.join("") + '</div>' : "")
      + '</div>' + (poster ? '<div class="poster"><img src="' + esc(imgUrl(poster, 1200)) + '" data-full="' + esc(imgUrl(poster, 2000)) + '" alt="' + esc(name) + '"></div>' : "")
      + '</div></section>';

    return topbar() + hero + '<div class="wrap events">' + eventSections(e, sched) + refereeHTML(s) + '</div>' + footer(s);
  }

  // EventSections 分頁由上而下決定段落順序；type 留空是文字段落，teams／schedule 會放入隊伍名單與賽程
  function eventSections(e, sched) {
    var list = rows("EventSections");
    if (!list.length) {
      // 還沒建 EventSections 分頁時的預設內容
      list = [{ type: "text", title: tr("eventAbout"), body: e.description || "", body_zh: e.description_zh || "" }, { type: "teams" }, { type: "schedule" }];
    }
    return list.map(function (r) {
      var type = String(r.type || "text").trim().toLowerCase();
      var title = loc(r, "title") || ({ teams: tr("teams"), schedule: tr("schedule") }[type] || "");
      var inner = type === "teams" ? teamsHTML() : type === "schedule" ? scheduleHTML(sched) : textSection(r);
      return inner ? (title ? '<h2>' + esc(title) + '</h2>' : "") + inner : "";
    }).join("");
  }
  function textSection(r) {
    var body = loc(r, "body"), map = String(r.map || "").trim();
    return (body ? '<div class="event-desc">' + paragraphs(body) + '</div>' : "")
      + (map ? '<div class="map"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="' + esc(map) + '" src="https://maps.google.com/maps?q='
        + encodeURIComponent(map) + '&output=embed"></iframe></div><p class="map-link"><a href="https://www.google.com/maps/search/?api=1&query='
        + encodeURIComponent(map) + '" target="_blank" rel="noopener">' + esc(tr("openMap")) + '</a></p>' : "");
  }
  function teamsHTML() {
    var groups = groupBy(rows("EventTeams").filter(function (t) { return loc(t, "team"); }), "division");
    if (!groups.length) return "";
    return '<div class="teams">' + groups.map(function (g) {
      return '<div class="division"><div class="division-head"><b>' + esc(loc(g.items[0], "division")) + '</b><span>' + esc(tr("teamCount")(g.items.length)) + '</span></div>'
        + '<ol>' + g.items.map(function (t) {
            var note = loc(t, "note");
            return '<li><span>' + esc(loc(t, "team")) + '</span>' + (note ? '<small>' + esc(note) + '</small>' : "") + '</li>';
          }).join("") + '</ol></div>';
    }).join("") + '</div>';
  }
  function scheduleHTML(sched) {
    if (!sched.length) return "";
    return groupBy(sched, "date").map(function (d) {
      return (d.key ? '<h3>' + esc(loc(d.items[0], "date")) + '</h3>' : "") + '<ul class="list schedule">' + d.items.map(function (r) {
        var note = loc(r, "note");
        return '<li><span class="when">' + esc(r.time || "") + '</span><span><span class="title">' + esc(loc(r, "item")) + '</span>'
          + (note ? '<span class="meta">' + esc(note) + '</span>' : "") + '</span></li>';
      }).join("") + '</ul>';
    }).join("");
  }
  // 裁判紀錄：Settings 的 show_referee 填 yes 才顯示
  function refereeHTML(s) {
    var ref = rows("Referee");
    if (!yes(s.show_referee) || !ref.length) return "";
    return '<h2>' + esc(tr("officiating")) + '</h2><p class="lead">' + esc(loc(s, "referee_intro") || tr("refereeLead")) + '</p>'
      + groupBy(ref, "year").map(function (y) {
          return '<h3>' + esc(y.key) + '</h3><ul class="list log">' + y.items.map(function (r) {
            var meta = [loc(r, "venue"), loc(r, "division")].filter(Boolean).map(esc).join(" · ");
            return '<li><span class="when">' + esc(r.date) + '</span><span><span class="title">' + esc(loc(r, "event")) + '</span>'
              + (meta ? '<span class="meta">' + meta + '</span>' : "") + '</span></li>';
          }).join("") + '</ul>';
        }).join("");
  }

  /* ---------- 繪製與路由 ---------- */
  var BUILD = { home: homeHTML, academic: academicHTML, photography: photographyHTML, events: eventsHTML };
  function parseHash() {
    var h = (location.hash || "").replace(/^#/, "").split("/");
    var v = OLD[h[0]] || h[0];
    return { view: VIEWS.indexOf(v) >= 0 ? v : "home", album: v === "photography" && h[1] !== undefined && h[1] !== "" ? +h[1] : null };
  }
  function render() {
    var s = settings();
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    VIEWS.forEach(function (v) {
      var el = document.getElementById("view-" + v);
      // 只重畫目前這頁，其他頁等切過去時再畫
      if (v === route.view) el.innerHTML = BUILD[v](s);
      el.classList.toggle("active", v === route.view);
    });
    var n = names(s).join(" ");
    document.title = route.view === "home" ? n : tr(route.view) + " · " + n;
  }
  function go(view, album, push) {
    route = { view: view, album: album == null ? null : album };
    render();
    try { window.scrollTo({ top: 0, behavior: "instant" }); } catch (e) { window.scrollTo(0, 0); }
    if (push !== false) {
      var h = "#" + view + (album != null ? "/" + album : "");
      try { history.pushState(null, "", view === "home" ? location.pathname : h); } catch (e) {}
    }
  }

  /* ---------- 圓圈轉場 ---------- */
  var fx = document.getElementById("portal-fx");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var busy = false;
  function circleAt(el) {
    var r = el.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var far = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    return { x: x, y: y, r: r.width / 2, far: far };
  }
  function clip(c, radius) { return "circle(" + radius + "px at " + c.x + "px " + c.y + "px)"; }
  function fxStart(color, from) {
    fx.style.transition = "none";
    fx.style.opacity = "1";
    fx.style.background = color;
    fx.style.clipPath = from;
    fx.classList.add("on");
    void fx.offsetWidth;
  }
  function fxFadeOut() {
    fx.style.transition = "opacity .35s ease";
    fx.style.opacity = "0";
    setTimeout(function () { fx.classList.remove("on"); busy = false; }, 360);
  }
  // 首頁 → 子頁：圓從被點的圓圈放大蓋滿畫面，再淡出露出子頁
  function openPortal(ring, view) {
    if (reduced || busy) { go(view); return; }
    busy = true;
    var c = circleAt(ring);
    fxStart(FX_COLOR[view], clip(c, c.r));
    fx.style.transition = "clip-path .62s cubic-bezier(.7,0,.25,1)";
    fx.style.clipPath = clip(c, c.far);
    setTimeout(function () { go(view); fxFadeOut(); }, 640);
  }
  // 子頁 → 首頁：先用子頁主色蓋滿，換回首頁後縮回原本的圓圈
  function closePortal() {
    var from = route.view;
    if (reduced || busy || !FX_COLOR[from]) { go("home"); return; }
    busy = true;
    fxStart(FX_COLOR[from], "circle(150% at 50% 50%)");
    go("home");
    var ring = document.querySelector('#view-home [data-go="' + from + '"] .ring');
    if (!ring) { fxFadeOut(); return; }
    ring.scrollIntoView({ block: "center", behavior: "instant" });
    var c = circleAt(ring);
    fx.style.clipPath = clip(c, c.far);
    void fx.offsetWidth;
    fx.style.transition = "clip-path .55s cubic-bezier(.7,0,.25,1)";
    fx.style.clipPath = clip(c, c.r);
    setTimeout(fxFadeOut, 560);
  }

  /* ---------- 燈箱（相簿內可左右切換） ---------- */
  var box = document.getElementById("lightbox"), boxImg = box.querySelector("img"), boxList = [], boxAt = 0;
  function boxShow(i) {
    boxAt = (i + boxList.length) % boxList.length;
    boxImg.src = boxList[boxAt];
    box.querySelector(".count").textContent = boxList.length > 1 ? (boxAt + 1) + " / " + boxList.length : "";
    box.querySelector(".prev").style.display = box.querySelector(".next").style.display = boxList.length > 1 ? "" : "none";
  }
  function boxOpen(img) {
    var group = img.closest(".masonry");
    var imgs = group ? [].slice.call(group.querySelectorAll("img")) : [img];
    boxList = imgs.map(function (x) { return x.getAttribute("data-full") || x.src; });
    box.classList.add("open");
    boxShow(imgs.indexOf(img));
  }
  function boxClose() { box.classList.remove("open"); boxImg.removeAttribute("src"); }
  box.querySelector(".prev").addEventListener("click", function (e) { e.stopPropagation(); boxShow(boxAt - 1); });
  box.querySelector(".next").addEventListener("click", function (e) { e.stopPropagation(); boxShow(boxAt + 1); });
  box.addEventListener("click", function (e) { if (e.target !== boxImg) boxClose(); });
  var touchX = null;
  box.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", function (e) {
    if (touchX == null) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 40) boxShow(boxAt + (dx < 0 ? 1 : -1));
  });
  document.addEventListener("keydown", function (e) {
    if (!box.classList.contains("open")) return;
    if (e.key === "Escape") boxClose();
    if (e.key === "ArrowLeft") boxShow(boxAt - 1);
    if (e.key === "ArrowRight") boxShow(boxAt + 1);
  });

  /* ---------- 點擊 ---------- */
  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-lang]"))) {
      lang = lang === "zh" ? "en" : "zh";
      try { localStorage.setItem("lang", lang); } catch (err) {}
      render();
      return;
    }
    if ((t = e.target.closest("[data-go]"))) {
      e.preventDefault();
      var view = t.getAttribute("data-go");
      if (view === "home") closePortal();
      else if (route.view === "home") openPortal(t.querySelector(".ring") || t, view);
      else go(view);
      return;
    }
    if ((t = e.target.closest("[data-album]"))) {
      e.preventDefault();
      var a = t.getAttribute("data-album");
      go("photography", a === "all" ? null : +a);
      return;
    }
    if ((t = e.target.closest("[data-scroll]"))) {
      var sec = document.getElementById(t.getAttribute("data-scroll"));
      if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - 70, behavior: "smooth" });
      return;
    }
    if ((t = e.target.closest(".masonry img, .poster img"))) boxOpen(t);
  });
  window.addEventListener("popstate", function () { var r = parseHash(); go(r.view, r.album, false); });

  route = parseHash();
  render();

  /* ---------- 讀取 Google 試算表 ---------- */
  // 分頁不存在時 Google 會改回傳第一個分頁，所以用「必須有的欄位」確認讀到的是對的分頁
  var TABS = {
    Settings: "key", Projects: "title", Columns: "title", Teaching: "course", Referee: "event", Photos: "title",
    Event: "field", EventSections: "type", EventTeams: "team", EventSchedule: "item"
  };
  function fetchTab(name) {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(name);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(function (txt) {
      var start = txt.indexOf("("), end = txt.lastIndexOf(")");
      var j = JSON.parse(txt.slice(start + 1, end));
      if (j.status === "error" || !j.table) return null;
      var cols = j.table.cols.map(function (c) { return String(c.label || "").trim().toLowerCase(); });
      if (cols.indexOf(TABS[name]) < 0) return null;
      return (j.table.rows || []).map(function (row) {
        var o = {};
        cols.forEach(function (h, i) {
          if (!h) return;
          var c = (row.c || [])[i];
          var v = c ? (c.f != null ? c.f : c.v) : "";
          o[h] = v == null ? "" : String(v).trim();
        });
        return o;
      }).filter(function (o) { return Object.keys(o).some(function (k) { return o[k] !== ""; }); });
    }).catch(function (e) { console.warn("[site] 讀不到分頁 " + name, e); return null; });
  }

  if (SHEET_ID) {
    var names_ = Object.keys(TABS);
    Promise.all(names_.map(fetchTab)).then(function (res) {
      var got = {}, any = false;
      names_.forEach(function (t, i) { if (res[i]) { got[t] = res[i]; any = true; } });
      if (!any) { console.warn("[site] 試算表讀不到，使用內建內容"); return; }
      D = Object.assign({}, D, got);
      render();
    });
  }
})();
</script>
</body>
</html>
