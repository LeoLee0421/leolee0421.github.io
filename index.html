  .album-meta{ display:flex; justify-content:space-between; align-items:baseline; gap:4px 16px; flex-wrap:wrap; }
  .album-meta .meta{ margin-top:0; }
  .album-meta a{ font-family:var(--sans); font-size:14px; }
  .album-desc{ margin:6px 0 0; max-width:68ch; }
  /* 一個活動一列，橫向捲動；照片維持原比例（載入前先用 3:2 佔位） */
  .gallery{

  var STATUS_ZH = { "in progress": "進行中", "working paper": "工作論文", "draft": "初稿" };
  function tr(k) { return TEXT[lang][k]; }
  // 讀欄位：先找目前語言的欄（例 lecture_zh），沒有就用原欄，再沒有就用另一語言的欄
  function loc(r, key) { return r[key + "_" + lang] || r[key] || r[key + "_" + (lang === "zh" ? "en" : "zh")] || ""; }
  function termLabel(r) {
    if (r["term_" + lang]) return r["term_" + lang];
    var m = String(r.term || "").trim().match(/^(spring|summer|fall|autumn|winter)\s+(\d{4})$/i);
    return m && lang === "zh" ? m[2] + " " + SEASON_ZH[m[1].toLowerCase()] : (r.term || "");
  }
  function statusLabel(r) {
    if (r["status_" + lang]) return r["status_" + lang];
    return (lang === "zh" && STATUS_ZH[String(r.status || "").trim().toLowerCase()]) || r.status || "";
  }

  function esc(s) {
    return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }
  function yes(v) { v = String(v || "").trim().toLowerCase(); return v === "yes" || v === "y" || v === "true" || v === "1" || v === "v" || v === "是"; }
  function hidden(r) { var v = String(r.hide || "").trim().toLowerCase(); return yes(v); }
  function rows(name) { return (D[name] || []).filter(function (r) { return !hidden(r); }); }
  function settings() {
    var o = {};
    (D.Settings || []).forEach(function (r) { if (r.key) o[String(r.key).trim()] = String(r.value == null ? "" : r.value).trim(); });
    return o;
  }
  // Google Drive 分享連結 → 可直接顯示的圖片網址；width 指定縮圖寬度
  function imgUrl(u, width) {
    u = String(u || "").trim();
    var m = u.match(/drive\.google\.com\/(?:file\/d\/|open\?id=|uc\?(?:export=\w+&)?id=)([\w-]+)/);
    return m ? "https://lh3.googleusercontent.com/d/" + m[1] + (width ? "=w" + width : "") : u;
  }
  function link(title, url, cls) {
    cls = cls || "title";
    return url ? '<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(title) + '</a>'
               : '<span class="' + cls + '">' + esc(title) + '</span>';
  }
  function tag(t) { return t ? '<span class="tag">' + esc(t) + '</span>' : ""; }
  function groupBy(list, key) {
    var order = [], map = {};
    list.forEach(function (r) {
      var k = String(r[key] || "").trim();
      if (!map[k]) { map[k] = []; order.push(k); }
      map[k].push(r);
    });
    return order.map(function (k) { return { key: k, items: map[k] }; });
  }
  function projectItem(p, showTerm) {
    var meta = [];
    if (showTerm && p.term) meta.push(esc(termLabel(p)));
    var lecture = loc(p, "lecture");
    var by = (lecture ? '<span class="lecture">' + esc(lecture) + '</span>' : "") + (p.coauthors ? esc(tr("by")) + esc(p.coauthors) : "");
    if (by) meta.push(by);
    return '<li>' + link(p.title, p.url) + tag(statusLabel(p)) + (meta.length ? '<span class="meta">' + meta.join(" · ") + '</span>' : "") + '</li>';
  }

  /* ---------- 各頁 ---------- */
  function homeHTML(s) {
    var roles = Object.keys(s).filter(function (k) { return /^role\d*$/.test(k) && loc(s, k); }).sort()
      .map(function (k) { return '<li>' + esc(loc(s, k)) + '</li>'; }).join("");
    var names = lang === "zh" ? [s.name_zh, s.name_en] : [s.name_en, s.name_zh];
    var about = loc(s, "about");
    var btns = [];
    if (s.cv_url) btns.push('<a class="primary" href="' + esc(s.cv_url) + '" target="_blank" rel="noopener">CV ↓</a>');
    if (s.email) btns.push('<a href="mailto:' + esc(s.email) + '">Email</a>');
    if (s.linkedin) btns.push('<a href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a>');
    if (s.github) btns.push('<a href="' + esc(s.github) + '" target="_blank" rel="noopener">GitHub ↗</a>');
    if (s.scholar) btns.push('<a href="' + esc(s.scholar) + '" target="_blank" rel="noopener">Google Scholar ↗</a>');

    var projects = rows("Projects");
    var picked = projects.filter(function (p) { return yes(p.home); });
    if (!picked.length) picked = projects.slice(0, 3);

    return '<div class="profile">'
      + '<img src="' + esc(imgUrl(s.photo_url || "photo.jpg")) + '" alt="' + esc(s.name_zh || "") + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_PHOTO + '\';">'
      + '<div><h1>' + esc(names.filter(Boolean).join(" ")) + '</h1>'
      + '<ul class="roles">' + roles + '</ul>'
      + (about ? '<p class="about">' + esc(about) + '</p>' : "")
      + '<div class="links">' + btns.join("") + '</div>'
      + (s.email ? '<p class="contact">' + esc(s.email) + '</p>' : "")
      + '</div></div>'
      + (picked.length ? '<h2>' + esc(tr("recent")) + '</h2><ul class="list">' + picked.map(function (p) { return projectItem(p, true); }).join("") + '</ul>'
        + '<p class="more"><a href="#articles" data-page="articles">' + esc(tr("allWork")) + '</a></p>' : "");
  }

  function articlesHTML() {
    var groups = groupBy(rows("Projects"), "term");
    var cols = rows("Columns");
    return '<h1>' + esc(tr("articles")) + '</h1><p class="lead">' + esc(tr("articlesLead")) + '</p>'
      + '<h2>' + esc(tr("papers")) + '</h2>'
      + groups.map(function (g) {
          return (g.key ? '<div class="term">' + esc(termLabel(g.items[0])) + '</div>' : "")
            + '<ul class="list">' + g.items.map(function (p) { return projectItem(p, false); }).join("") + '</ul>';
        }).join("")
      + (cols.length ? '<h2>' + esc(tr("columns")) + '</h2><ul class="list">'
        + cols.map(function (c) { return '<li>' + link(c.title, c.url) + tag(c.tag) + '</li>'; }).join("") + '</ul>' : "");
  }

  function teachingHTML() {
    return '<h1>' + esc(tr("teaching")) + '</h1><p class="lead">' + esc(tr("teachingLead")) + '</p>'
      + groupBy(rows("Teaching"), "course").map(function (c) {
          return '<h2>' + esc(loc(c.items[0], "course")) + '</h2>'
            + groupBy(c.items, "category").map(function (cat) {
                return (cat.key ? '<h3>' + esc(loc(cat.items[0], "category")) + '</h3>' : "")
                  + '<ul class="list">' + cat.items.map(function (t) { return '<li>' + link(t.title, t.url) + tag(t.tag) + '</li>'; }).join("") + '</ul>';
              }).join("");
        }).join("");
  }

  function refereeHTML(s) {
    return '<h1>' + esc(tr("referee")) + '</h1><p class="lead">' + esc(loc(s, "referee_intro") || tr("refereeLead")) + '</p>'
      + groupBy(rows("Referee"), "year").map(function (y) {
          return '<h2>' + esc(y.key) + '</h2><ul class="list log">'
            + y.items.map(function (r) {
                var meta = [loc(r, "venue"), loc(r, "division")].filter(Boolean).map(esc).join(" · ");
                return '<li><span class="date">' + esc(r.date) + '</span><span class="entry"><span class="title">' + esc(loc(r, "event")) + '</span>'
                  + (meta ? '<span class="meta">' + meta + '</span>' : "") + '</span></li>';
              }).join("") + '</ul>';
        }).join("");
  }

  function photographyHTML(s) {
    // 一列一個活動：photo1～photo6 是精選照片，drive_url 是完整相簿
    var albums = rows("Photos").filter(function (a) { return loc(a, "title") || a.photo1 || a.drive_url; });
    return '<h1>' + esc(tr("photography")) + '</h1><p class="lead">' + esc(loc(s, "photo_intro") || tr("photoLead")) + '</p>'
      + (s.instagram ? '<div class="links" style="margin-top:18px;"><a class="primary" href="' + esc(s.instagram) + '" target="_blank" rel="noopener">Instagram' + (s.instagram_handle ? " · " + esc(s.instagram_handle) : "") + ' ↗</a></div>' : "")
      + albums.map(function (a) {
          var title = loc(a, "title"), desc = loc(a, "description");
          var meta = [a.date, loc(a, "location")].filter(Boolean).map(esc).join(" · ");
          var photos = [1, 2, 3, 4, 5, 6].map(function (i) { return a["photo" + i]; }).filter(Boolean);
          var drive = a.drive_url ? '<a href="' + esc(a.drive_url) + '" target="_blank" rel="noopener">' + esc(tr("drive")) + '</a>' : "";
          return '<h2>' + esc(title) + '</h2>'
            + (meta || drive ? '<div class="album-meta"><span class="meta">' + meta + '</span>' + drive + '</div>' : "")
            + (desc ? '<p class="album-desc">' + esc(desc) + '</p>' : "")
            + (photos.length ? '<div class="gallery">' + photos.map(function (u) {
                return '<img loading="lazy" src="' + esc(imgUrl(u, 800)) + '" data-full="' + esc(imgUrl(u, 2000)) + '" alt="' + esc(title) + '">';
              }).join("") + '</div>' : "");
        }).join("");
  }

  /* ---------- 繪製與切換 ---------- */
  function render() {
    var s = settings();
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    document.querySelectorAll("[data-i18n]").forEach(function (el) { el.textContent = tr(el.getAttribute("data-i18n")); });
    document.getElementById("lang-toggle").textContent = tr("toggle");
    document.getElementById("brand-en").textContent = s.name_en || "";
    document.getElementById("brand-zh").textContent = s.name_zh || "";
    document.getElementById("page-home").innerHTML = homeHTML(s);
    document.getElementById("page-articles").innerHTML = articlesHTML(s);
    document.getElementById("page-teaching").innerHTML = teachingHTML(s);
    document.getElementById("page-referee").innerHTML = refereeHTML(s);
    document.getElementById("page-photography").innerHTML = photographyHTML(s);
    document.getElementById("footer").textContent = "© " + new Date().getFullYear() + " " + (s.name_zh || "") + " " + (s.name_en || "");
    if (s.name_en || s.name_zh) document.title = (s.name_en || "") + " " + (s.name_zh || "");
    show(current, false);
  }

  function show(id, scroll) {
    if (PAGES.indexOf(id) < 0) id = "home";
    current = id;
    PAGES.forEach(function (p) { document.getElementById("page-" + p).classList.toggle("active", p === id); });
    document.querySelectorAll(".nav ul a").forEach(function (a) { a.classList.toggle("active", a.getAttribute("data-page") === id); });
    if (scroll !== false) { try { window.scrollTo(0, 0); } catch (e) {} }
  }

  // 點擊切換（不依賴網址 #，所以在預覽視窗裡也能用）
  document.addEventListener("click", function (e) {
    var a = e.target.closest("[data-page]");
    if (!a) return;
    e.preventDefault();
    var id = a.getAttribute("data-page");
    show(id);
    try { history.pushState(null, "", "#" + id); } catch (err) {}
  });
  document.getElementById("lang-toggle").addEventListener("click", function () {
    lang = lang === "zh" ? "en" : "zh";
    try { localStorage.setItem("lang", lang); } catch (e) {}
    render();
  });
  // 點照片放大，點任何地方或按 Esc 關閉
  var box = document.getElementById("lightbox");
  document.addEventListener("click", function (e) {
    var img = e.target.closest(".gallery img");
    if (img) { box.querySelector("img").src = img.getAttribute("data-full") || img.src; box.classList.add("open"); }
    else if (e.target.closest("#lightbox")) box.classList.remove("open");
  });
  document.addEventListener("keydown", function (e) { if (e.key === "Escape") box.classList.remove("open"); });
  window.addEventListener("popstate", function () { show((location.hash || "#home").slice(1)); });
  window.addEventListener("hashchange", function () { show((location.hash || "#home").slice(1)); });

  current = (location.hash || "#home").slice(1);
  render();

  /* ---------- 讀取 Google 試算表 ---------- */
  function fetchTab(name) {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(name);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(function (txt) {
      var start = txt.indexOf("("), end = txt.lastIndexOf(")");
      var j = JSON.parse(txt.slice(start + 1, end));
      if (j.status === "error" || !j.table) return null;
      var cols = j.table.cols.map(function (c) { return String(c.label || "").trim().toLowerCase(); });
      if (!cols.some(Boolean)) return null;
      return (j.table.rows || []).map(function (row) {
        var o = {};
        cols.forEach(function (h, i) {
          if (!h) return;
          var c = (row.c || [])[i];
          var v = c ? (c.f != null ? c.f : c.v) : "";
          o[h] = v == null ? "" : String(v).trim();
        });
        return o;
      }).filter(function (o) { return Object.keys(o).some(function (k) { return o[k] !== ""; }); });
    }).catch(function (e) { console.warn("[site] 讀不到分頁 " + name, e); return null; });
  }

  if (SHEET_ID) {
    var tabs = ["Settings", "Projects", "Columns", "Teaching", "Referee", "Photos"];
    Promise.all(tabs.map(fetchTab)).then(function (res) {
      var got = {}, any = false;
      tabs.forEach(function (t, i) { if (res[i]) { got[t] = res[i]; any = true; } });
      if (!any) { console.warn("[site] 試算表讀不到，使用內建內容"); return; }
      D = Object.assign({}, DATA, got);
      render();
    });
  }
})();
</script>
</body>
</html>
