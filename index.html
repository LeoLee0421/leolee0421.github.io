<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Leo Yu-Chieh Lee 李祐頡</title>
<meta name="description" content="李祐頡 Leo Yu-Chieh Lee — 國立臺灣大學經濟學系。學術研究、攝影作品與賽事籌辦。">
<meta property="og:title" content="Leo Yu-Chieh Lee 李祐頡">
<meta property="og:description" content="Research · Photography · Event organizing">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&family=Noto+Serif+TC:wght@400;600&family=Inter:wght@400;500;600&family=Playfair+Display:ital,wght@1,600&display=swap" rel="stylesheet">
<style>
  /* ===== 顏色與字型：要換風格，改這裡就好 ===== */
  :root{
    --bg:#FBFAF7;
    --text:#1F2328;
    --muted:#5F6670;
    --faint:#8A9099;
    --line:#E4E1DA;
    --accent:#1E3A5F;      /* 學術：深藍 */
    --accent-soft:#E8EEF5;
    --event:#B4441F;       /* 賽事：磚紅 */
    --event-deep:#2A1A14;
    --gallery:#0F1012;     /* 攝影：畫廊黑 */
    --gallery-text:#ECEAE5;
    --gallery-muted:#9A9DA3;
    --gallery-line:#26282C;
    --serif:'Source Serif 4','Noto Serif TC',Georgia,serif;
    --sans:'Inter','Noto Sans TC',-apple-system,'PingFang TC','Microsoft JhengHei',sans-serif;
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#16181C; --text:#E6E4DF; --muted:#A3A7AE; --faint:#7C818A;
      --line:#2C3036; --accent:#9DB8DA; --accent-soft:#1F2833; --event:#E07A52;
    }
  }

  *{ box-sizing:border-box; }
  html{ scroll-behavior:smooth; }
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:var(--serif); font-size:17px; line-height:1.7;
    -webkit-font-smoothing:antialiased;
  }
  a{ color:var(--accent); text-decoration:none; border-bottom:1px solid transparent; transition:border-color .15s; }
  a:hover{ border-bottom-color:currentColor; }
  img{ display:block; }
  .wrap{ max-width:1080px; margin:0 auto; padding:0 24px; }

  .view{ display:none; }
  .view.active{ display:block; animation:fade .35s ease; }
  @keyframes fade{ from{ opacity:0; } to{ opacity:1; } }

  h1{ font-size:34px; font-weight:600; line-height:1.2; margin:0 0 8px; letter-spacing:-.01em; }
  h2{ font-family:var(--sans); font-size:18px; font-weight:600; color:var(--accent); margin:48px 0 14px; padding-bottom:8px; border-bottom:1px solid var(--line); }
  h3{ font-family:var(--sans); font-size:14px; font-weight:600; color:var(--muted); margin:24px 0 6px; }
  .lead{ color:var(--muted); margin:0 0 8px; max-width:68ch; }

  /* 按鈕與標籤 */
  .links{ display:flex; flex-wrap:wrap; gap:10px; font-family:var(--sans); font-size:14px; }
  .links a{ border:1px solid var(--line); padding:6px 14px; border-radius:20px; color:var(--text); }
  .links a:hover{ border-color:var(--accent); color:var(--accent); }
  .links a.primary{ background:var(--accent); border-color:var(--accent); color:var(--bg); }
  .tag{
    display:inline-block; font-family:var(--sans); font-size:11px; font-weight:500; letter-spacing:.03em;
    padding:1px 8px; border-radius:10px; background:var(--accent-soft); color:var(--accent); margin-left:6px; vertical-align:2px;
  }
  .lecture{
    display:inline-block; font-size:12px; line-height:1.5; padding:0 9px; border:1px solid var(--line); border-radius:10px;
    color:var(--muted); margin-right:8px;
  }
  .lang{
    font-family:var(--sans); font-size:12.5px; color:inherit; background:none; cursor:pointer;
    border:1px solid currentColor; border-radius:12px; padding:2px 10px; opacity:.75;
  }
  .lang:hover{ opacity:1; }

  /* 列表 */
  .list{ list-style:none; padding:0; margin:0; }
  .list li{ padding:10px 0; border-bottom:1px solid var(--line); }
  .list li:last-child{ border-bottom:0; }
  .title{ font-weight:600; }
  .meta{ display:block; font-family:var(--sans); font-size:13.5px; color:var(--muted); margin-top:2px; }
  .cv li{ display:grid; grid-template-columns:110px 1fr; gap:16px; }
  .cv .when{ font-family:var(--sans); font-size:13.5px; color:var(--faint); padding-top:3px; }

  /* 子頁上方列 */
  .topbar{
    position:sticky; top:0; z-index:10; border-bottom:1px solid var(--line);
    background:color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
  }
  .topbar-inner{ display:flex; align-items:center; gap:20px; padding-top:12px; padding-bottom:12px; }
  .back{ font-family:var(--sans); font-size:14px; color:var(--muted); cursor:pointer; white-space:nowrap; }
  .back:hover{ color:var(--text); }
  .tabs{ display:flex; gap:20px; margin-left:auto; overflow-x:auto; font-family:var(--sans); font-size:14px; }
  .tabs a{ color:var(--muted); white-space:nowrap; cursor:pointer; }
  .tabs a:hover{ color:var(--text); }
  .topbar .lang{ color:var(--muted); }
  .topbar .spacer{ margin-left:auto; }

  footer{ padding:28px 0 40px; font-family:var(--sans); font-size:13px; color:var(--faint); }

  /* ===== 首頁：全黑底 ===== */
  #view-home{ background:#000; color:#fff; min-height:100vh; }
  #view-home footer{ color:rgba(255,255,255,.4); }
  .banner{ position:relative; color:#fff; overflow:hidden; background:#000; }
  .banner.has-img{ background-size:cover; background-position:center; }
  .banner.has-img::before{ content:""; position:absolute; inset:0; background:linear-gradient(90deg, rgba(10,14,20,.78) 0%, rgba(10,14,20,.45) 60%, rgba(10,14,20,.25) 100%); }
  /* 內容區比整頁窄並置中，讓 banner 往中間靠但仍靠左排列 */
  .banner-inner{ position:relative; display:grid; grid-template-columns:240px 1fr; gap:44px; align-items:center; max-width:900px; padding-top:72px; padding-bottom:28px; }
  .banner .avatar{ width:240px; height:240px; object-fit:cover; border:3px solid rgba(255,255,255,.85); background:rgba(255,255,255,.15); }
  .banner h1{ font-size:40px; margin:0; color:#fff; }
  .banner .alt{ font-size:20px; opacity:.8; margin:0 0 14px; }
  .banner .roles{ list-style:none; padding:0; margin:0 0 14px; font-size:16.5px; }
  .banner .roles li{ padding:2px 0; opacity:.92; }
  .banner .bio{ max-width:60ch; margin:0 0 18px; opacity:.92; }
  .banner .links a{ color:#fff; border-color:rgba(255,255,255,.5); }
  .banner .links a:hover{ border-color:#fff; color:#fff; }
  .banner .links a.primary{ background:#fff; border-color:#fff; color:#000; }
  .banner .lang{ position:absolute; top:18px; right:24px; z-index:1; color:#fff; }

  .portals{ padding-top:28px; padding-bottom:40px; }
  /* 圓圈上方的標題：Playfair Display 斜體，每個字首字母大寫 */
  .portals-title{ font-family:'Playfair Display','Noto Serif TC',Georgia,serif; font-style:italic; font-weight:600; font-size:34px; line-height:1.2; text-transform:capitalize; color:#fff; text-align:center; margin:0 0 26px; }
  .portal-grid{ display:grid; grid-template-columns:repeat(3,1fr); gap:32px; }
  .portal{ display:flex; flex-direction:column; align-items:center; text-align:center; color:#fff; border:0; cursor:pointer; }
  .portal:hover{ border:0; }
  .ring{
    width:min(220px, 100%); aspect-ratio:1; border-radius:50%; overflow:hidden; display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 1px rgba(255,255,255,.18);
    transition:transform .35s cubic-bezier(.2,.8,.2,1), box-shadow .35s;
  }
  .ring img{ width:100%; height:100%; object-fit:cover; transition:transform .6s cubic-bezier(.2,.8,.2,1); }
  .ring svg{ width:64px; height:64px; stroke:#fff; fill:none; stroke-width:1.4; opacity:.9; }
  .portal:hover .ring{ transform:translateY(-6px); box-shadow:0 0 0 3px rgba(255,255,255,.85), 0 18px 40px rgba(255,255,255,.08); }
  .portal:hover .ring img{ transform:scale(1.06); }
  .portal-name{ font-family:var(--sans); font-size:19px; font-weight:600; margin-top:20px; }
  .portal-sub{ font-family:var(--sans); font-size:14px; color:rgba(255,255,255,.6); margin-top:2px; }

  /* 點圓圈的轉場：一個圓從圓圈位置放大到蓋滿畫面 */
  .portal-fx{ position:fixed; inset:0; z-index:100; pointer-events:none; display:none; }
  .portal-fx.on{ display:block; }

  /* ===== 學術 ===== */
  .academic{ display:grid; grid-template-columns:300px 1fr; gap:64px; padding-top:48px; }
  .side{ position:sticky; top:84px; align-self:start; }
  .side img{ width:100%; max-width:260px; aspect-ratio:5/6; height:auto; object-fit:cover; border-radius:4px; background:var(--line); margin-bottom:20px; }
  .side .name{ font-size:26px; font-weight:600; line-height:1.25; }
  .side .alt{ font-size:18px; color:var(--muted); margin:2px 0 14px; }
  .side ul{ list-style:none; padding:0; margin:0 0 20px; font-family:var(--sans); font-size:15px; color:var(--muted); line-height:1.5; }
  .side ul li{ margin-bottom:8px; }
  /* 側欄連結：一行一個，CV 用外框按鈕突顯 */
  .side .links{ flex-direction:column; align-items:flex-start; gap:8px; font-size:15px; }
  .side .links a{ border:0; padding:0; color:var(--accent); background:none; }
  .side .links a:hover{ border-bottom:1px solid currentColor; }
  .side .links a.primary{ border:1px solid var(--accent); border-radius:20px; padding:5px 16px; margin-bottom:4px; font-weight:600; color:var(--accent); background:none; }
  .side .links a.primary:hover{ background:var(--accent); color:var(--bg); }
  .academic main h2:first-child{ margin-top:0; }
  .bio-text p{ margin:0 0 12px; max-width:70ch; }

  /* ===== 攝影：畫廊 ===== */
  #view-photography{ background:var(--gallery); color:var(--gallery-text); min-height:100vh; }
  #view-photography .topbar{ background:color-mix(in srgb, var(--gallery) 88%, transparent); border-bottom-color:var(--gallery-line); }
  #view-photography .back, #view-photography .topbar .lang{ color:var(--gallery-muted); }
  #view-photography .back:hover{ color:var(--gallery-text); }
  #view-photography a{ color:var(--gallery-text); }
  #view-photography footer{ color:var(--gallery-muted); }
  .gallery-head{ padding-top:64px; padding-bottom:12px; }
  .gallery-head h1{ font-size:44px; font-weight:400; letter-spacing:.01em; }
  .gallery-head .lead{ color:var(--gallery-muted); }
  .gallery-head .links a{ color:var(--gallery-text); border-color:var(--gallery-line); }
  .gallery-head .links a:hover{ border-color:var(--gallery-text); }
  .albums{ display:grid; grid-template-columns:repeat(auto-fill, minmax(300px,1fr)); gap:36px 28px; padding-top:36px; padding-bottom:24px; }
  .album-card{ display:block; border:0; cursor:pointer; }
  .album-card:hover{ border:0; }
  .album-card .cover{ aspect-ratio:4/3; overflow:hidden; background:var(--gallery-line); border-radius:2px; display:flex; align-items:center; justify-content:center; }
  .album-card .cover img{ width:100%; height:100%; object-fit:cover; transition:transform .7s cubic-bezier(.2,.8,.2,1), opacity .3s; opacity:.92; }
  .album-card:hover .cover img{ transform:scale(1.04); opacity:1; }
  .album-card .cover svg{ width:44px; height:44px; stroke:var(--gallery-muted); fill:none; stroke-width:1.3; }
  .album-card .cap{ margin-top:12px; }
  .album-card .cap b{ display:block; font-weight:400; font-size:19px; line-height:1.35; }
  .album-card .cap span{ display:block; font-family:var(--sans); font-size:13px; color:var(--gallery-muted); margin-top:4px; }
  .album-head{ padding-top:48px; padding-bottom:8px; }
  .album-head .back{ display:inline-block; margin-bottom:22px; }
  .album-head h1{ font-size:38px; font-weight:400; }
  .album-head .meta{ color:var(--gallery-muted); }
  .album-head p{ max-width:68ch; color:var(--gallery-muted); }
  .album-head .drive{ font-family:var(--sans); font-size:14px; }
  .masonry{ columns:3 300px; column-gap:14px; padding-top:28px; padding-bottom:24px; }
  .masonry img{ width:100%; height:auto; margin:0 0 14px; break-inside:avoid; border-radius:2px; cursor:zoom-in; background:var(--gallery-line); }

  .lightbox{ position:fixed; inset:0; z-index:90; display:none; align-items:center; justify-content:center; background:rgba(5,6,8,.94); }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width:calc(100% - 120px); max-height:calc(100% - 80px); object-fit:contain; }
  .lightbox button{
    position:absolute; background:none; border:0; color:#fff; opacity:.7; cursor:pointer; font-family:var(--sans);
    font-size:34px; line-height:1; padding:16px;
  }
  .lightbox button:hover{ opacity:1; }
  .lightbox .prev{ left:8px; top:50%; transform:translateY(-50%); }
  .lightbox .next{ right:8px; top:50%; transform:translateY(-50%); }
  .lightbox .close{ top:8px; right:8px; font-size:28px; }
  .lightbox .count{ position:absolute; bottom:18px; left:0; right:0; text-align:center; color:#aaa; font-family:var(--sans); font-size:13px; }

  /* ===== 賽事（UJ CUP）：藍黃為主色，文字區一律白底黑字 ===== */
  .ev{
    --ev-blue:#124A84; --ev-yellow:#F2B900;   /* 取自 UJ CUP 海報 */ --ev-ink:#111418; --ev-muted:#4B5260; --ev-line:#E2E6EE; --ev-page:#EEF2F9;
    background:var(--ev-page); color:var(--ev-ink); min-height:100vh; font-family:var(--sans);
  }
  .ev a{ color:var(--ev-blue); }
  .ev-nav{ position:sticky; top:0; z-index:10; background:var(--ev-blue); color:#fff; box-shadow:0 2px 12px rgba(0,0,0,.12); }
  .ev-nav-inner{ display:flex; align-items:center; gap:24px; padding-top:12px; padding-bottom:12px; }
  .ev-brand{ font-size:18px; font-weight:800; letter-spacing:.04em; color:var(--ev-yellow) !important; white-space:nowrap; cursor:pointer; border:0; }
  .ev-nav .back{ color:rgba(255,255,255,.8); }
  .ev-nav .back:hover{ color:#fff; }
  .ev-tabs{ display:flex; gap:20px; margin-left:auto; overflow-x:auto; scrollbar-width:none; font-size:14.5px; font-weight:500; }
  .ev-tabs::-webkit-scrollbar{ display:none; }
  .ev-tabs a{ color:#fff !important; white-space:nowrap; cursor:pointer; padding:4px 0; border-bottom:2px solid transparent; }
  .ev-tabs a:hover{ border-bottom-color:var(--ev-yellow); }
  .ev-nav .lang{ color:#fff; flex:none; }

  /* 主視覺：hero_url 寬幅大圖滿版；沒有就把海報放在白底上，寬度約下方內容區的 2/3 */
  .ev-hero img.wide{ width:100%; height:auto; display:block; }
  .ev-hero{ background:#fff; }
  .ev-hero .stage{ display:flex; justify-content:center; align-items:center; padding:28px 16px 12px; }
  .ev-hero .stage img{ width:min(688px, 100%); height:auto; cursor:zoom-in; }
  .ev-hero .stage .word{ font-size:72px; font-weight:800; color:var(--ev-blue); letter-spacing:.04em; padding:60px 0; }

  /* 賽事資訊總覽卡 */
  .ev-summary{ position:relative; padding-top:24px; }
  .ev-card{ background:#fff; color:var(--ev-ink); border-radius:10px; box-shadow:0 4px 18px rgba(17,20,24,.06); padding:28px 32px; }
  .ev-summary .ev-card{ border-top:6px solid var(--ev-yellow); }
  .ev-kicker{ font-size:13px; font-weight:700; letter-spacing:.12em; text-transform:uppercase; color:var(--ev-blue); }
  .ev-summary h1{ font-family:var(--sans); font-size:34px; font-weight:800; color:var(--ev-ink); margin:6px 0 4px; letter-spacing:0; }
  .ev-tagline{ font-size:18px; color:var(--ev-muted); margin:0 0 20px; }
  .ev-facts{ display:grid; grid-template-columns:repeat(auto-fit, minmax(190px,1fr)); gap:12px; margin:0 0 20px; }
  .ev-fact{ border-left:4px solid var(--ev-blue); padding:2px 0 2px 12px; }
  .ev-fact b{ display:block; font-size:12.5px; font-weight:700; letter-spacing:.06em; color:var(--ev-muted); }
  .ev-fact span{ display:block; font-size:16.5px; font-weight:600; margin-top:2px; }
  .ev-badges{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:18px; }
  .ev-badge{ font-size:14px; font-weight:700; padding:6px 14px; border-radius:20px; background:var(--ev-blue); color:#fff; }
  .ev-badge.yellow{ background:var(--ev-yellow); color:var(--ev-ink); }
  .ev-btns{ display:flex; flex-wrap:wrap; gap:10px; }
  .ev-btn{ display:inline-block; font-size:15px; font-weight:700; padding:10px 22px; border-radius:8px; border:2px solid var(--ev-blue); color:var(--ev-blue) !important; background:#fff; }
  .ev-btn:hover{ background:var(--ev-blue); color:#fff !important; }
  .ev-btn.primary{ background:var(--ev-yellow); border-color:var(--ev-yellow); color:var(--ev-ink) !important; }
  .ev-btn.primary:hover{ filter:brightness(.95); }
  .ev-btn.sm{ font-size:14px; padding:5px 16px; border-radius:6px; margin:2px 0; vertical-align:middle; }
  .ev-btn.off{ border-color:var(--ev-line); color:var(--ev-muted) !important; background:#F4F5F7; cursor:default; }

  /* 各段落 */
  .ev-body{ display:flex; flex-direction:column; gap:22px; padding-top:22px; padding-bottom:40px; }
  .ev-body h2{
    font-family:var(--sans); font-size:22px; font-weight:800; color:var(--ev-ink); margin:0 0 18px; padding:0 0 0 14px;
    border:0; border-left:6px solid var(--ev-yellow); line-height:1.25;
  }
  .ev-body h3{ font-family:var(--sans); font-size:15px; font-weight:700; color:var(--ev-ink); margin:20px 0 6px; padding-left:10px; border-left:3px solid var(--ev-blue); }
  .ev-body h3:first-child{ margin-top:0; }
  .ev .list li{ border-bottom-color:var(--ev-line); }
  .ev .meta{ color:var(--ev-muted); }
  .ev .title{ font-weight:700; }
  .ev-text p{ margin:0 0 10px; line-height:1.8; }
  .ev .lead{ max-width:none; }
  .ev-text p:last-child{ margin-bottom:0; }

  .ev-news{ display:grid; grid-template-columns:repeat(auto-fill, minmax(250px,1fr)); gap:16px; }
  .ev-post{ border:1px solid var(--ev-line); border-radius:8px; overflow:hidden; display:flex; flex-direction:column; background:#fff; }
  .ev-post img{ width:100%; aspect-ratio:16/9; object-fit:cover; background:var(--ev-line); }
  .ev-post .in{ padding:14px 16px 16px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .ev-post .date{ font-size:13px; font-weight:700; color:var(--ev-blue); }
  .ev-post .title{ font-size:16.5px; line-height:1.4; }
  .ev-post p{ margin:0; font-size:14.5px; color:var(--ev-muted); line-height:1.6; }
  .ev-post .more{ margin-top:auto; padding-top:6px; font-size:14px; font-weight:700; }
  .ev-pin{ display:inline-block; font-size:11.5px; font-weight:800; background:var(--ev-yellow); color:var(--ev-ink); padding:1px 8px; border-radius:10px; margin-left:6px; vertical-align:2px; }
  .ev-more-news summary{ font-size:14.5px; font-weight:700; color:var(--ev-blue); cursor:pointer; padding:14px 0 0; }
  .ev-more-news .ev-news{ margin-top:14px; }

  .teams{ display:grid; grid-template-columns:repeat(auto-fit, minmax(280px,1fr)); gap:18px; }
  .division{ border:1px solid var(--ev-line); border-radius:8px; padding:16px 20px 8px; }
  .division-head{ display:flex; justify-content:space-between; align-items:center; padding-bottom:10px; border-bottom:3px solid var(--ev-blue); }
  .division-head b{ font-size:17px; font-weight:800; }
  .division-head span{ font-size:13px; font-weight:700; background:var(--ev-yellow); color:var(--ev-ink); padding:2px 10px; border-radius:12px; }
  .division ol{ margin:0; padding:6px 0 0 1.7em; }
  .division li{ padding:7px 0; border-bottom:1px solid var(--ev-line); }
  .division li:last-child{ border-bottom:0; }
  .division li::marker{ font-size:13px; font-weight:700; color:var(--ev-blue); }
  .division small{ display:block; font-size:13px; color:var(--ev-muted); }

  .schedule li{ display:grid; grid-template-columns:90px 1fr auto; gap:16px; align-items:baseline; }
  .schedule .when{ font-size:15px; font-weight:800; color:var(--ev-blue); }
  .schedule .result{ font-size:14px; font-weight:800; white-space:nowrap; }
  .schedule .result:not(:empty){ background:var(--ev-yellow); padding:2px 10px; border-radius:6px; }

  .map{ margin-top:16px; aspect-ratio:16/7; border-radius:8px; overflow:hidden; border:1px solid var(--ev-line); background:var(--ev-line); }
  .map iframe{ width:100%; height:100%; border:0; display:block; }
  .map-link{ font-size:14px; font-weight:700; margin:8px 0 0; }

    return url ? '<a class="' + cls + '" href="' + esc(url) + '" target="_blank" rel="noopener">' + esc(title) + '</a>'
               : '<span class="' + cls + '">' + esc(title) + '</span>';
  }
  function tag(t) { return t ? '<span class="tag">' + esc(t) + '</span>' : ""; }
  function groupBy(list, key) {
    var order = [], map = {};
    list.forEach(function (r) {
      var k = String(r[key] || "").trim();
      if (!map[k]) { map[k] = []; order.push(k); }
      map[k].push(r);
    });
    return order.map(function (k) { return { key: k, items: map[k] }; });
  }
  function paragraphs(text) {
    return String(text || "").split(/\n\s*\n|\n/).filter(function (p) { return p.trim(); })
      .map(function (p) { return '<p>' + esc(p.trim()) + '</p>'; }).join("");
  }
  function names(s) { return (lang === "zh" ? [s.name_zh, s.name_en] : [s.name_en, s.name_zh]).filter(Boolean); }
  function roles(s) {
    return Object.keys(s).filter(function (k) { return /^role\d*$/.test(k) && loc(s, k); }).sort().map(function (k) { return loc(s, k); });
  }
  function profileImg(s, cls) {
    return '<img class="' + (cls || "") + '" src="' + esc(imgUrl(s.photo_url || "photo.jpg", 600)) + '" alt="' + esc(s.name_zh || "") + '" onerror="this.onerror=null;this.src=\'' + FALLBACK_PHOTO + '\';">';
  }
  function langBtn() { return '<button type="button" class="lang" data-lang>' + esc(tr("toggle")) + '</button>'; }
  function topbar(middle) {
    return '<nav class="topbar"><div class="wrap topbar-inner"><a class="back" data-go="home">' + esc(tr("home")) + '</a>'
      + (middle || '<span class="spacer"></span>') + langBtn() + '</div></nav>';
  }
  function footer(s) { return '<footer><div class="wrap">© ' + new Date().getFullYear() + " " + esc(names(s).join(" ")) + '</div></footer>'; }
  var ICONS = {
    photography: '<svg viewBox="0 0 24 24"><path d="M3 8h3l2-3h8l2 3h3v11H3z"/><circle cx="12" cy="13" r="4"/></svg>',
    academic: '<svg viewBox="0 0 24 24"><path d="M2 9l10-5 10 5-10 5z"/><path d="M6 11v5c3 2 9 2 12 0v-5"/></svg>',
    events: '<svg viewBox="0 0 24 24"><path d="M8 4h8v5a4 4 0 0 1-8 0z"/><path d="M8 6H5a3 3 0 0 0 3 4M16 6h3a3 3 0 0 1-3 4M12 13v4M8 20h8"/></svg>'
  };
  function cvButtons(s) {
    var b = [];
    if (s.cv_url) b.push('<a class="primary" href="' + esc(s.cv_url) + '" target="_blank" rel="noopener">CV ↓</a>');
    if (s.email) b.push('<a href="mailto:' + esc(s.email) + '">Email</a>');
    if (s.linkedin) b.push('<a href="' + esc(s.linkedin) + '" target="_blank" rel="noopener">LinkedIn ↗</a>');
    if (s.scholar) b.push('<a href="' + esc(s.scholar) + '" target="_blank" rel="noopener">Google Scholar ↗</a>');
    if (s.github) b.push('<a href="' + esc(s.github) + '" target="_blank" rel="noopener">GitHub ↗</a>');
    return b.join("");
  }

  /* ---------- 首頁 ---------- */
  function homeHTML(s) {
    var n = names(s), bio = loc(s, "about");
    // 圓圈下方的文字可在 Settings 用 portal_<頁面>_name／_sub 改寫
    var portal = function (id, color) {
      var img = s["portal_" + id + "_img"];
      return '<a class="portal" href="#' + id + '" data-go="' + id + '">'
        + '<span class="ring" style="background:' + color + '">' + (img ? '<img src="' + esc(imgUrl(img, 600)) + '" alt="">' : ICONS[id]) + '</span>'
        + '<span class="portal-name">' + esc(loc(s, "portal_" + id + "_name") || tr(id)) + '</span>'
        + '<span class="portal-sub">' + esc(loc(s, "portal_" + id + "_sub") || tr(id + "Sub")) + '</span></a>';
    };
    return '<header class="banner' + (s.banner_url ? ' has-img" style="background-image:url(\'' + esc(imgUrl(s.banner_url, 2000)) + '\')' : '') + '">'
      + langBtn()
      + '<div class="wrap banner-inner">' + profileImg(s, "avatar")
      + '<div><h1>' + esc(n[0] || "") + '</h1>' + (n[1] ? '<p class="alt">' + esc(n[1]) + '</p>' : "")
      + '<ul class="roles">' + roles(s).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join("") + '</ul>'
      + (bio ? '<p class="bio">' + esc(bio) + '</p>' : "")
      + '<div class="links">' + cvButtons(s) + '</div></div></div></header>'
      + '<section class="wrap portals"><p class="portals-title">' + esc(String(loc(s, "portals_title") || tr("explore")).toLowerCase()) + '</p><div class="portal-grid">'
      + portal("photography", "#2B2D31") + portal("academic", FX_COLOR.academic) + portal("events", "#B4441F")
      + '</div></section>' + footer(s);
  }

  /* ---------- 學術 ---------- */
  function projectItem(p) {
    var meta = [];
    var lecture = loc(p, "lecture");
    var by = (lecture ? '<span class="lecture">' + esc(lecture) + '</span>' : "") + (p.coauthors ? esc(tr("by")) + esc(p.coauthors) : "");
    if (by) meta.push(by);
    return '<li><span class="when">' + esc(termLabel(p)) + '</span><span>' + link(p.title, p.url) + tag(statusLabel(p))
      + (meta.length ? '<span class="meta">' + meta.join(" · ") + '</span>' : "") + '</span></li>';
  }
  function academicHTML(s) {
    var n = names(s), bio = loc(s, "academic_bio") || loc(s, "about");
    var projects = rows("Projects"), cols = rows("Columns"), teach = rows("Teaching");
    var tabs = [["about", bio], ["research", projects.length], ["writing", cols.length], ["teaching", teach.length]]
      .filter(function (t) { return t[1]; })
      .map(function (t) { return '<a data-scroll="sec-' + t[0] + '">' + esc(tr(t[0])) + '</a>'; }).join("");
    return topbar('<div class="tabs">' + tabs + '</div>')
      + '<div class="wrap academic"><aside class="side">' + profileImg(s)
      + '<div class="name">' + esc(n[0] || "") + '</div>' + (n[1] ? '<div class="alt">' + esc(n[1]) + '</div>' : "")
      // 學術頁不列裁判身分
      + '<ul>' + roles(s).filter(function (r) { return !/referee|裁判/i.test(r); }).map(function (r) { return '<li>' + esc(r) + '</li>'; }).join("") + '</ul>'
      + '<div class="links">' + cvButtons(s) + '</div></aside><main>'
      + (bio ? '<h2 id="sec-about">' + esc(tr("about")) + '</h2><div class="bio-text">' + paragraphs(bio) + '</div>' : "")
      + (projects.length ? '<h2 id="sec-research">' + esc(tr("research")) + '</h2><ul class="list cv">' + projects.map(projectItem).join("") + '</ul>' : "")
      + (cols.length ? '<h2 id="sec-writing">' + esc(tr("writing")) + '</h2><ul class="list">'
        + cols.map(function (c) { return '<li>' + link(c.title, c.url) + tag(c.tag) + '</li>'; }).join("") + '</ul>' : "")
      + (teach.length ? '<h2 id="sec-teaching">' + esc(tr("teaching")) + '</h2>'
        + groupBy(teach, "course").map(function (c) {
            return '<h3>' + esc(loc(c.items[0], "course")) + '</h3>'
              + groupBy(c.items, "category").map(function (cat) {
                  return '<ul class="list cv">' + cat.items.map(function (t, i) {
                    return '<li><span class="when">' + (i === 0 ? esc(loc(t, "category")) : "") + '</span><span>' + link(t.title, t.url) + tag(t.tag) + '</span></li>';
                  }).join("") + '</ul>';
                }).join("");
          }).join("") : "")
      + '</main></div>' + footer(s);
  }

  /* ---------- 攝影 ---------- */
  // drive_url 資料夾裡的所有照片（PhotoFiles 分頁，由試算表的 Apps Script「更新照片清單」產生）
  function folderId(u) { var m = String(u || "").match(/folders\/([\w-]+)/); return m ? m[1] : ""; }
  // cover 與 photo 欄位可填連結，也可只填檔名（例如 IMG_0123 或 IMG_0123.JPG），用檔名到該活動的資料夾清單裡找
  function photoRef(a, v) {
    v = String(v || "").trim();
    if (!v || v.indexOf("/") >= 0) return v;
    var id = folderId(a.drive_url), want = v.toLowerCase().replace(/\.[^.]+$/, "");
    var hit = rows("PhotoFiles").filter(function (f) {
      return f.folder_id === id && String(f.name || "").toLowerCase().replace(/\.[^.]+$/, "") === want;
    })[0];
    return hit ? "https://drive.google.com/file/d/" + hit.file_id + "/view" : "";
  }
  // 手動填在 photo 開頭欄位的照片
  function manualPhotos(a) {
    return Object.keys(a).filter(function (k) { return /^photo/.test(k) && a[k]; })
      .map(function (k) { return photoRef(a, a[k]); }).filter(Boolean);
  }
  function folderFiles(a) {
    var id = folderId(a.drive_url);
    if (!id) return [];
    return rows("PhotoFiles").filter(function (f) { return f.folder_id === id && f.file_id; })
      .map(function (f) { return "https://drive.google.com/file/d/" + f.file_id + "/view"; });
  }
  // 藝廊照片：photo 欄位填的最愛照片排最前面，不足 gallery_random_count 張（預設 20）時，
  // 從資料夾其他照片隨機補足；每次打開網頁只挑一次，切換語言或頁面時維持同一組
  var picked = {};
  function fileId(u) { var m = String(u).match(/\/d\/([\w-]+)/); return m ? m[1] : u; }
  function albumPhotos(a) {
    var favs = manualPhotos(a), pool = folderFiles(a);
    if (!pool.length) return favs;
    var key = folderId(a.drive_url) + ":" + pool.length + ":" + favs.join("|");
    if (!picked[key]) {
      var n = parseInt(settings().gallery_random_count, 10) || 20;
      var taken = {};
      favs.forEach(function (u) { taken[fileId(u)] = true; });
      var rest = pool.filter(function (u) { return !taken[fileId(u)]; });
      for (var i = rest.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)), t = rest[i]; rest[i] = rest[j]; rest[j] = t; }
      picked[key] = favs.concat(rest.slice(0, Math.max(0, n - favs.length)));
    }
    return picked[key];
  }
  function albumCover(a) { return photoRef(a, a.cover) || manualPhotos(a)[0] || folderFiles(a)[0]; }
  function albumCount(a) { return folderFiles(a).length || manualPhotos(a).length; }
  function albums() {
    return rows("Photos").filter(function (a) { return loc(a, "title") || a.drive_url || manualPhotos(a).length; });
  }
  function albumMeta(a) { return [a.date, loc(a, "location")].filter(Boolean).map(esc).join(" · "); }
  function photographyHTML(s) {
    var list = albums();
    if (route.album != null && list[route.album]) return albumHTML(s, list[route.album]);
    var ig = s.instagram ? '<div class="links" style="margin-top:18px;"><a href="' + esc(s.instagram) + '" target="_blank" rel="noopener">Instagram'
      + (s.instagram_handle ? " · " + esc(s.instagram_handle) : "") + ' ↗</a></div>' : "";
    return topbar() + '<div class="wrap gallery-head"><h1>' + esc(tr("photography")) + '</h1><p class="lead">' + esc(loc(s, "photo_intro") || tr("photoLead")) + '</p>' + ig + '</div>'
      + '<div class="wrap albums">' + list.map(function (a, i) {
          var count = albumCount(a), cover = albumCover(a);
          var inner = '<div class="cover">' + (cover ? '<img loading="lazy" src="' + esc(imgUrl(cover, 900)) + '" alt="">' : ICONS.photography) + '</div>'
            + '<div class="cap"><b>' + esc(loc(a, "title")) + '</b><span>' + albumMeta(a)
            + (count ? (albumMeta(a) ? " · " : "") + count + " " + esc(tr("photos")) : "") + '</span></div>';
          // 沒有任何照片的活動，直接連到 Google Drive
          return count ? '<a class="album-card" href="#photography/' + i + '" data-album="' + i + '">' + inner + '</a>'
            : '<a class="album-card" href="' + esc(a.drive_url || "#") + '" target="_blank" rel="noopener">' + inner + '</a>';
        }).join("") + '</div>' + footer(s);
  }
  function albumHTML(s, a) {
    var desc = loc(a, "description");
    return topbar() + '<div class="wrap album-head"><a class="back" data-album="all">' + esc(tr("allAlbums")) + '</a>'
      + '<h1>' + esc(loc(a, "title")) + '</h1><span class="meta">' + albumMeta(a) + '</span>'
      + (desc ? '<p>' + esc(desc) + '</p>' : "")
      + (a.drive_url ? '<p class="drive"><a href="' + esc(a.drive_url) + '" target="_blank" rel="noopener">' + esc(tr("drive")) + '</a></p>' : "")
      + '</div><div class="wrap masonry">' + albumPhotos(a).map(function (u, i) {
          return '<img loading="lazy" src="' + esc(imgUrl(u, 900)) + '" data-full="' + esc(imgUrl(u, 2000)) + '" data-i="' + i + '" alt="' + esc(loc(a, "title")) + '">';
        }).join("") + '</div>' + footer(s);
  }

  /* ---------- 賽事 ---------- */
  function daysUntil(d) {
    var m = String(d || "").match(/(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})/);
    if (!m) return null;
    var start = new Date(+m[1], m[2] - 1, +m[3]), now = new Date();
    now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    return Math.round((start - now) / 86400000);
  }
  function ext(url, text, cls) {
    return '<a' + (cls ? ' class="' + cls + '"' : "") + ' href="' + esc(url) + '" target="_blank" rel="noopener">' + text + '</a>';
  }

  // 賽事頁是獨立的賽事資訊網：上方藍色導覽列、主視覺、白底黑字的資訊卡片；從個人首頁點進來時才顯示「← Home」
  function eventsHTML(s) {
    var e = eventInfo(), name = loc(e, "name"), short = loc(e, "short_name") || name || tr("events");
    var hero = e.hero_url, poster = e.poster_url;
    var dateText = loc(e, "date_text") || [e.start_date, e.end_date].filter(Boolean).join(" – ");
    var days = daysUntil(e.start_date), reg = daysUntil(e.register_deadline), closed = reg != null && reg < 0;
    var colors = (e.color_blue ? "--ev-blue:" + esc(e.color_blue) + ";" : "") + (e.color_yellow ? "--ev-yellow:" + esc(e.color_yellow) + ";" : "");

    var btns = [];
    if (e.register_url) btns.push(closed ? '<span class="ev-btn off">' + esc(tr("regClosed")) + '</span>' : ext(e.register_url, esc(tr("register")) + " ↗", "ev-btn primary"));
    if (e.rules_url) btns.push(ext(e.rules_url, esc(tr("rules")) + " ↗", "ev-btn"));
    if (e.website) btns.push(ext(e.website, esc(tr("website")) + " ↗", "ev-btn"));
    if (e.instagram) btns.push(ext(e.instagram, "Instagram ↗", "ev-btn"));
    var facts = [[tr("date"), dateText], [tr("venue"), loc(e, "venue")], [tr("divisions"), loc(e, "divisions")],
      [tr("fee"), loc(e, "fee")], [tr("deadline"), loc(e, "register_deadline_text") || e.register_deadline]]
      .filter(function (f) { return f[1]; })
      .map(function (f) { return '<div class="ev-fact"><b>' + esc(f[0]) + '</b><span>' + esc(f[1]) + '</span></div>'; }).join("");
    var badges = [];
    if (days != null && days >= 0) badges.push('<span class="ev-badge">' + esc(days === 0 ? tr("today") : tr("daysToGo")(days)) + '</span>');
    if (reg != null && !closed && e.register_url) badges.push('<span class="ev-badge yellow">' + esc(reg === 0 ? tr("regToday") : tr("regLeft")(reg)) + '</span>');

    var visual = hero ? '<img class="wide" src="' + esc(imgUrl(hero, 2400)) + '" alt="' + esc(name) + '">'
      : '<div class="stage">' + (poster ? '<img src="' + esc(imgUrl(poster, 1400)) + '" data-full="' + esc(imgUrl(poster, 2400)) + '" alt="' + esc(name) + '">'
        : '<span class="word">' + esc(short) + '</span>') + '</div>';

    var summary = '<section class="wrap ev-summary"><div class="ev-card">'
      + (loc(e, "kicker") ? '<div class="ev-kicker">' + esc(loc(e, "kicker")) + '</div>' : "")
      + '<h1>' + esc(name || tr("events")) + '</h1>'
      + '<p class="ev-tagline">' + esc(loc(e, "tagline") || (name ? "" : tr("eventSoon"))) + '</p>'
      + (facts ? '<div class="ev-facts">' + facts + '</div>' : "")
      + (badges.length ? '<div class="ev-badges">' + badges.join("") + '</div>' : "")
      + (btns.length ? '<div class="ev-btns">' + btns.join("") + '</div>' : "")
      + '</div></section>';

    var secs = eventSections(s, e), ref = refereeHTML(s);
    var tabs = secs.filter(function (x) { return x.title; })
      .map(function (x) { return '<a data-scroll="' + x.id + '">' + esc(x.title) + '</a>'; }).join("");
    var left = cameFromHome ? '<a class="back" data-go="home">' + esc(tr("home")) + '</a>'
      : '<a class="ev-brand" data-scroll="top">' + esc(short) + '</a>';

    return '<div class="ev" style="' + colors + '">'
      + '<nav class="ev-nav"><div class="wrap ev-nav-inner">' + left + '<div class="ev-tabs">' + tabs + '</div>' + langBtn() + '</div></nav>'
      + '<header class="ev-hero">' + visual + '</header>' + summary
      + '<main class="wrap ev-body">'
      + secs.map(function (x) { return '<section class="ev-card" id="' + x.id + '">' + (x.title ? '<h2>' + esc(x.title) + '</h2>' : "") + x.html + '</section>'; }).join("")
      + (ref ? '<section class="ev-card">' + ref + '</section>' : "")
      + '</main>'
      + '<footer class="ev-foot"><div class="wrap">© ' + new Date().getFullYear() + " " + esc(short)
      + ' · ' + esc(tr("siteBy")) + ' <a data-go="home">' + esc(names(s)[0] || "") + '</a></div></footer></div>';
  }

  // EventSections 分頁由上而下決定段落順序。type：留空＝文字段落，
  // news＝最新公告、teams＝報名隊伍、schedule＝賽程、docs＝檔案下載、contact＝聯絡資訊、organizers＝主辦單位
  var SECTION_TYPES = {
    news: function () { return newsHTML(); }, teams: function () { return teamsHTML(); },
    schedule: function () { return scheduleHTML(); }, docs: function () { return docsHTML(); },
    contact: function (s, e) { return contactHTML(e); }, organizers: function (s, e) { return organizersHTML(s, e); }
  };
  function eventSections(s, e) {
    var list = rows("EventSections");
    if (!list.length) {
      list = [{ type: "news" }, { type: "", title: tr("eventAbout"), body: e.description || "", body_zh: e.description_zh || "" },
        { type: "teams" }, { type: "schedule" }, { type: "docs" }, { type: "contact" }, { type: "organizers" }];
    }
    return list.map(function (r, i) {
      var type = String(r.type || "").trim().toLowerCase();
      var make = SECTION_TYPES[type];
      var html = make ? make(s, e) : textSection(r, e);
      return { id: "ev-" + i, title: loc(r, "title") || (make ? tr("sec_" + type) : ""), html: html };
    }).filter(function (x) { return x.html; });
  }
  // 文字段落裡的網址會變成按鈕：Google 表單顯示「立即報名 ↗」（報名截止後變灰），其他連結用網址前面的文字當按鈕名稱
  function linkParagraphs(text, e) {
    var closed = (daysUntil(e.register_deadline) || 0) < 0;
    return String(text || "").split(/\n/).filter(function (p) { return p.trim(); }).map(function (line) {
      var html = "", last = 0, m, re = /https?:\/\/[^\s，。、）)]+/g;
      while ((m = re.exec(line))) {
        var before = line.slice(last, m.index), url = m[0];
        var label = before.replace(/^\s*\d+[.、)]\s*/, "").replace(/[：:\s]+$/, "");
        var btn = /docs\.google\.com\/forms|forms\.gle/.test(url)
          ? (closed ? '<span class="ev-btn sm off">' + esc(tr("regClosed")) + '</span>' : ext(url, esc(tr("registerNow")), "ev-btn sm primary"))
          : ext(url, esc((label || tr("openLink")) + " ↗"), "ev-btn sm");
        html += esc(before) + btn;
        last = m.index + url.length;
      }
      return '<p>' + html + esc(line.slice(last)) + '</p>';
    }).join("");
  }
  function textSection(r, e) {
    var body = loc(r, "body"), map = String(r.map || "").trim();
    return (body ? '<div class="ev-text">' + linkParagraphs(body, e) + '</div>' : "")
      + (map ? '<div class="map"><iframe loading="lazy" referrerpolicy="no-referrer-when-downgrade" title="' + esc(map) + '" src="https://maps.google.com/maps?q='
        + encodeURIComponent(map) + '&output=embed"></iframe></div><p class="map-link">'
        + ext("https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(map), esc(tr("openMap"))) + '</p>' : "");
  }
  // 最新公告：pin 填 yes 的置頂，其餘照試算表順序（新的放上面）；超過 6 則的收合起來
  function newsHTML() {
    var list = rows("EventNews").filter(function (n) { return loc(n, "title"); });
    if (!list.length) return "";
    list = list.filter(function (n) { return yes(n.pin); }).concat(list.filter(function (n) { return !yes(n.pin); }));
    // 公告卡片：image 欄填 Drive 圖片連結就會有封面圖
    var item = function (n) {
      var body = loc(n, "body");
      return '<article class="ev-post">' + (n.image ? '<img loading="lazy" src="' + esc(imgUrl(n.image, 800)) + '" alt="">' : "")
        + '<div class="in"><span class="date">' + esc(loc(n, "date")) + '</span>'
        + '<span class="title">' + esc(loc(n, "title")) + (yes(n.pin) ? '<span class="ev-pin">' + esc(tr("pinned")) + '</span>' : "") + '</span>'
        + (body ? paragraphs(body) : "")
        + (n.url ? '<span class="more">' + ext(n.url, esc(tr("readMore"))) + '</span>' : "") + '</div></article>';
    };
    var shown = list.slice(0, 6), more = list.slice(6);
    return '<div class="ev-news">' + shown.map(item).join("") + '</div>'
      + (more.length ? '<details class="ev-more-news"><summary>' + esc(tr("moreNews")(more.length)) + '</summary><div class="ev-news">' + more.map(item).join("") + '</div></details>' : "");
  }
  function teamsHTML() {
    // 用 division 或 division_zh 分組，只填其中一欄也能正確分組
    var groups = groupBy(rows("EventTeams").filter(function (t) { return loc(t, "team"); })
      .map(function (t) { return Object.assign({ _group: t.division || t.division_zh || "" }, t); }), "_group");
    if (!groups.length) return "";
    return '<div class="teams">' + groups.map(function (g) {
      return '<div class="division"><div class="division-head"><b>' + esc(loc(g.items[0], "division")) + '</b><span>' + esc(tr("teamCount")(g.items.length)) + '</span></div>'
        + '<ol>' + g.items.map(function (t) {
            var note = loc(t, "note");
            return '<li><span>' + esc(loc(t, "team")) + '</span>' + (note ? '<small>' + esc(note) + '</small>' : "") + '</li>';
          }).join("") + '</ol></div>';
    }).join("") + '</div>';
  }
  // 賽程依日期分組；court（場地）、result（比數）選填
  function scheduleHTML() {
    var sched = rows("EventSchedule").filter(function (r) { return loc(r, "item"); });
    if (!sched.length) return "";
    sched = sched.map(function (r) { return Object.assign({ _group: r.date || r.date_zh || "" }, r); });
    return groupBy(sched, "_group").map(function (d) {
      return (d.key ? '<h3>' + esc(loc(d.items[0], "date")) + '</h3>' : "") + '<ul class="list schedule">' + d.items.map(function (r) {
        var meta = [loc(r, "court"), loc(r, "note")].filter(Boolean).map(esc).join(" · ");
        return '<li><span class="when">' + esc(r.time || "") + '</span><span><span class="title">' + esc(loc(r, "item")) + '</span>'
          + (meta ? '<span class="meta">' + meta + '</span>' : "") + '</span>'
          + '<span class="result">' + esc(loc(r, "result")) + '</span></li>';
      }).join("") + '</ul>';
    }).join("");
  }
  function docsHTML() {
    var list = rows("EventDocs").filter(function (d) { return loc(d, "name") && d.url; });
    if (!list.length) return "";
    return '<div class="docs">' + list.map(function (d) {
      var note = loc(d, "note");
      return ext(d.url, '<span><b>' + esc(loc(d, "name")) + '</b>' + (note ? '<small>' + esc(note) + '</small>' : "") + '</span><i>↓</i>', "doc");
    }).join("") + '</div>';
  }
  function kv(pairs) {
    pairs = pairs.filter(function (p) { return p[1]; });
    return pairs.length ? '<dl class="kv">' + pairs.map(function (p) { return '<dt>' + esc(p[0]) + '</dt><dd>' + p[1] + '</dd>'; }).join("") + '</dl>' : "";
  }
  function contactHTML(e) {
    return kv([
      [tr("contactName"), esc(loc(e, "contact_name"))],
      ["Email", e.contact_email ? '<a href="mailto:' + esc(e.contact_email) + '">' + esc(e.contact_email) + '</a>' : ""],
      [tr("phone"), e.phone ? '<a href="tel:' + esc(String(e.phone).replace(/[^\d+]/g, "")) + '">' + esc(e.phone) + '</a>' : ""],
      ["LINE", e.line_url ? ext(e.line_url, esc(loc(e, "line_name") || e.line_url)) : ""],
      ["Instagram", e.instagram ? ext(e.instagram, esc(loc(e, "instagram_handle") || e.instagram)) : ""]
    ]);
  }
  function organizersHTML(s, e) {
    return kv([
      [tr("organizer"), esc(loc(e, "organizer"))],
      [tr("coOrganizer"), esc(loc(e, "co_organizer"))],
      [tr("sponsor"), esc(loc(e, "sponsor"))],
      [loc(e, "my_role"), loc(e, "my_role") ? esc(names(s)[0] || "") : ""]
    ]);
  }
  // 裁判紀錄：Settings 的 show_referee 填 yes 才顯示
  function refereeHTML(s) {
    var ref = rows("Referee");
    if (!yes(s.show_referee) || !ref.length) return "";
    return '<h2>' + esc(tr("officiating")) + '</h2><p class="lead">' + esc(loc(s, "referee_intro") || tr("refereeLead")) + '</p>'
      + groupBy(ref, "year").map(function (y) {
          return '<h3>' + esc(y.key) + '</h3><ul class="list log">' + y.items.map(function (r) {
            var meta = [loc(r, "venue"), loc(r, "division")].filter(Boolean).map(esc).join(" · ");
            return '<li><span class="when">' + esc(r.date) + '</span><span><span class="title">' + esc(loc(r, "event")) + '</span>'
              + (meta ? '<span class="meta">' + meta + '</span>' : "") + '</span></li>';
          }).join("") + '</ul>';
        }).join("");
  }

  /* ---------- 繪製與路由 ---------- */
  var BUILD = { home: homeHTML, academic: academicHTML, photography: photographyHTML, events: eventsHTML };
  // 賽事可用自訂網址，例如 #ujcup（Event 分頁的 slug）
  function eventSlug() { return String(eventInfo().slug || "").trim().toLowerCase(); }
  function parseHash() {
    var h = (location.hash || "").replace(/^#/, "").split("/");
    var v = OLD[h[0]] || h[0];
    if (eventSlug() && h[0].toLowerCase() === eventSlug()) v = "events";
    return { view: VIEWS.indexOf(v) >= 0 ? v : "home", album: v === "photography" && h[1] !== undefined && h[1] !== "" ? +h[1] : null };
  }
  function render() {
    var s = settings();
    document.documentElement.lang = lang === "zh" ? "zh-Hant" : "en";
    VIEWS.forEach(function (v) {
      var el = document.getElementById("view-" + v);
      // 只重畫目前這頁，其他頁等切過去時再畫
      if (v === route.view) el.innerHTML = BUILD[v](s);
      el.classList.toggle("active", v === route.view);
    });
    var n = names(s).join(" ");
    var ev = route.view === "events" && loc(eventInfo(), "name");
    document.title = route.view === "home" ? n : ev || tr(route.view) + " · " + n;
  }
  function go(view, album, push) {
    route = { view: view, album: album == null ? null : album };
    render();
    try { window.scrollTo({ top: 0, behavior: "instant" }); } catch (e) { window.scrollTo(0, 0); }
    if (push !== false) {
      var h = "#" + (view === "events" && eventSlug() ? eventSlug() : view) + (album != null ? "/" + album : "");
      try { history.pushState(null, "", view === "home" ? location.pathname : h); } catch (e) {}
    }
  }

  /* ---------- 圓圈轉場 ---------- */
  var fx = document.getElementById("portal-fx");
  var reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var busy = false;
  function circleAt(el) {
    var r = el.getBoundingClientRect();
    var x = r.left + r.width / 2, y = r.top + r.height / 2;
    var far = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
    return { x: x, y: y, r: r.width / 2, far: far };
  }
  function clip(c, radius) { return "circle(" + radius + "px at " + c.x + "px " + c.y + "px)"; }
  function fxStart(color, from) {
    fx.style.transition = "none";
    fx.style.opacity = "1";
    fx.style.background = color;
    fx.style.clipPath = from;
    fx.classList.add("on");
    void fx.offsetWidth;
  }
  function fxFadeOut() {
    fx.style.transition = "opacity .35s ease";
    fx.style.opacity = "0";
    setTimeout(function () { fx.classList.remove("on"); busy = false; }, 360);
  }
  // 首頁 → 子頁：圓從被點的圓圈放大蓋滿畫面，再淡出露出子頁
  function openPortal(ring, view) {
    if (reduced || busy) { go(view); return; }
    busy = true;
    var c = circleAt(ring);
    fxStart(FX_COLOR[view], clip(c, c.r));
    fx.style.transition = "clip-path .62s cubic-bezier(.7,0,.25,1)";
    fx.style.clipPath = clip(c, c.far);
    setTimeout(function () { go(view); fxFadeOut(); }, 640);
  }
  // 子頁 → 首頁：先用子頁主色蓋滿，換回首頁後縮回原本的圓圈
  function closePortal() {
    var from = route.view;
    if (reduced || busy || !FX_COLOR[from]) { go("home"); return; }
    busy = true;
    fxStart(FX_COLOR[from], "circle(150% at 50% 50%)");
    go("home");
    var ring = document.querySelector('#view-home [data-go="' + from + '"] .ring');
    if (!ring) { fxFadeOut(); return; }
    ring.scrollIntoView({ block: "center", behavior: "instant" });
    var c = circleAt(ring);
    fx.style.clipPath = clip(c, c.far);
    void fx.offsetWidth;
    fx.style.transition = "clip-path .55s cubic-bezier(.7,0,.25,1)";
    fx.style.clipPath = clip(c, c.r);
    setTimeout(fxFadeOut, 560);
  }

  /* ---------- 燈箱（相簿內可左右切換） ---------- */
  var box = document.getElementById("lightbox"), boxImg = box.querySelector("img"), boxList = [], boxAt = 0;
  function boxShow(i) {
    boxAt = (i + boxList.length) % boxList.length;
    boxImg.src = boxList[boxAt];
    box.querySelector(".count").textContent = boxList.length > 1 ? (boxAt + 1) + " / " + boxList.length : "";
    box.querySelector(".prev").style.display = box.querySelector(".next").style.display = boxList.length > 1 ? "" : "none";
  }
  function boxOpen(img) {
    var group = img.closest(".masonry");
    var imgs = group ? [].slice.call(group.querySelectorAll("img")) : [img];
    boxList = imgs.map(function (x) { return x.getAttribute("data-full") || x.src; });
    box.classList.add("open");
    boxShow(imgs.indexOf(img));
  }
  function boxClose() { box.classList.remove("open"); boxImg.removeAttribute("src"); }
  box.querySelector(".prev").addEventListener("click", function (e) { e.stopPropagation(); boxShow(boxAt - 1); });
  box.querySelector(".next").addEventListener("click", function (e) { e.stopPropagation(); boxShow(boxAt + 1); });
  box.addEventListener("click", function (e) { if (e.target !== boxImg) boxClose(); });
  var touchX = null;
  box.addEventListener("touchstart", function (e) { touchX = e.touches[0].clientX; }, { passive: true });
  box.addEventListener("touchend", function (e) {
    if (touchX == null) return;
    var dx = e.changedTouches[0].clientX - touchX; touchX = null;
    if (Math.abs(dx) > 40) boxShow(boxAt + (dx < 0 ? 1 : -1));
  });
  document.addEventListener("keydown", function (e) {
    if (!box.classList.contains("open")) return;
    if (e.key === "Escape") boxClose();
    if (e.key === "ArrowLeft") boxShow(boxAt - 1);
    if (e.key === "ArrowRight") boxShow(boxAt + 1);
  });

  /* ---------- 點擊 ---------- */
  document.addEventListener("click", function (e) {
    var t;
    if ((t = e.target.closest("[data-lang]"))) {
      lang = lang === "zh" ? "en" : "zh";
      try { localStorage.setItem("lang", lang); } catch (err) {}
      render();
      return;
    }
    if ((t = e.target.closest("[data-go]"))) {
      e.preventDefault();
      var view = t.getAttribute("data-go");
      if (view === "home") closePortal();
      else if (route.view === "home") { cameFromHome = true; openPortal(t.querySelector(".ring") || t, view); }
      else go(view);
      return;
    }
    if ((t = e.target.closest("[data-album]"))) {
      e.preventDefault();
      var a = t.getAttribute("data-album");
      go("photography", a === "all" ? null : +a);
      return;
    }
    if ((t = e.target.closest("[data-scroll]"))) {
      if (t.getAttribute("data-scroll") === "top") { window.scrollTo({ top: 0, behavior: "smooth" }); return; }
      var sec = document.getElementById(t.getAttribute("data-scroll"));
      if (sec) window.scrollTo({ top: sec.getBoundingClientRect().top + scrollY - 70, behavior: "smooth" });
      return;
    }
    if ((t = e.target.closest(".masonry img, .ev-hero .stage img"))) boxOpen(t);
  });
  window.addEventListener("popstate", function () { var r = parseHash(); go(r.view, r.album, false); });

  route = parseHash();
  render();

  /* ---------- 讀取 Google 試算表 ---------- */
  // 分頁不存在時 Google 會改回傳第一個分頁，所以用「必須有的欄位」確認讀到的是對的分頁
  var TABS = {
    Settings: "key", Projects: "title", Columns: "title", Teaching: "course", Referee: "event", Photos: "title",
    Event: "field", EventSections: "type", EventTeams: "team", EventSchedule: "item", EventNews: "title", EventDocs: "url", PhotoFiles: "file_id"
  };
  function fetchTab(name) {
    var url = "https://docs.google.com/spreadsheets/d/" + SHEET_ID + "/gviz/tq?tqx=out:json&headers=1&sheet=" + encodeURIComponent(name);
    return fetch(url).then(function (r) { if (!r.ok) throw new Error("HTTP " + r.status); return r.text(); }).then(function (txt) {
      var start = txt.indexOf("("), end = txt.lastIndexOf(")");
      var j = JSON.parse(txt.slice(start + 1, end));
      if (j.status === "error" || !j.table) return null;
      var cols = j.table.cols.map(function (c) { return String(c.label || "").trim().toLowerCase(); });
      if (cols.indexOf(TABS[name]) < 0) return null;
      return (j.table.rows || []).map(function (row) {
        var o = {};
        cols.forEach(function (h, i) {
          if (!h) return;
          var c = (row.c || [])[i];
          var v = c ? (c.f != null ? c.f : c.v) : "";
          o[h] = v == null ? "" : String(v).trim();
        });
        return o;
      }).filter(function (o) { return Object.keys(o).some(function (k) { return o[k] !== ""; }); });
    }).catch(function (e) { console.warn("[site] 讀不到分頁 " + name, e); return null; });
  }

  if (SHEET_ID) {
    var names_ = Object.keys(TABS);
    Promise.all(names_.map(fetchTab)).then(function (res) {
      var got = {}, any = false;
      names_.forEach(function (t, i) { if (res[i]) { got[t] = res[i]; any = true; } });
      if (!any) { console.warn("[site] 試算表讀不到，使用內建內容"); return; }
      D = Object.assign({}, D, got);
      if (route.view === "home" && location.hash) route = parseHash();
      render();
    });
  }
})();
</script>
</body>
</html>
